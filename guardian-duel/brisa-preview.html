<style>*{box-sizing:border-box}body{margin:0 auto;padding:24px;max-width:1500px;background:#0b191c;color:#f5ecd8;font:15px/1.5 system-ui}h1{font:36px Georgia;margin:0}p{color:#adc8bf}header{display:flex;justify-content:space-between;gap:14px}button,select{border:1px solid #72968a;border-radius:7px;background:#203c34;color:#f5ecd8;padding:9px 14px;cursor:pointer}button[aria-pressed=true]{background:#5a6946;border-color:#eac778}a{color:#9ee2cc}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:18px 0}.stage{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:center}article{border:1px solid #3a5b54;border-radius:12px;overflow:hidden;background:#142a2b}h2{font-size:15px;margin:12px 16px}canvas{display:block;width:100%;height:auto}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}#contact{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}#contact button{padding:0;background:#122629;overflow:hidden}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}.gallery button{border:0;width:100%;padding:8px;border-radius:0;text-align:left}small,footer{color:#a3beb4}footer{margin-top:24px;font-size:13px}details{margin-top:20px}@media(max-width:800px){body{padding:14px}.stage{grid-template-columns:1fr}.stage article:first-child{width:100%;max-width:340px;margin:auto}.gallery{grid-template-columns:repeat(2,1fr)}#contact{grid-template-columns:repeat(3,1fr)}h1{font-size:29px}}
