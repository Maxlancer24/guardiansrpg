 '<p class="b">Tag fights split the screen into who is <strong>in</strong> and who is <strong>on the bench</strong>. The active lane shows full stats; benched fighters are one compact line each, and a fainted one is struck through.</p>'+
 dsc(g,"🏷️ Tag Team Combat - Choose Action",
  '<p class="dsc__hd">⚔️ ACTIVE LANE</p>'+
  '<p class="dsc__row"><span class="dsc__nm">🔵 Max</span> ✅'+
   '<span class="dsc__sub"><span class="bar">'+hpbar(140,230)+'</span> <code>140/230 HP</code></span>'+
   '<span class="dsc__sub"><code>STR:32 AGI:13 CON:12</code> | <code>Item:Used</code></span></p>'+
  '<p class="dsc__row"><span class="dsc__nm">🔴 Rival</span> ⏳'+
   '<span class="dsc__sub"><span class="bar">'+hpbar(205,240)+'</span> <code>205/240 HP</code></span>'+
   '<span class="dsc__sub"><code>STR:18 AGI:16 CON:11</code> | <code>Item:Focus Potion</code></span></p>'+
  '<p class="dsc__hd">💤 BENCH</p>'+
  '<p class="dsc__row"><span class="dsc__nm">🔵 Ally</span> <code>210/210 HP</code> <code>STR:12 AGI:9 CON:20</code></p>'+
  '<p class="dsc__row"><span style="color:#949ba4;text-decoration:line-through">🔴 Straggler</span> 💀</p>',
  "Select the name of the enemy you want to ATTACK.\n⏰ 2 Minutes to choose.")+
 '<p class="embcap">Switching a benched fighter in costs your turn, so the bench view is deliberately compact — you are reading it to decide who to rotate, not to fight from it.</p>'+

 '<h2 class="s">Battle Royale</h2>'+
 '<p class="b">The training free-for-all tracks a temporary <strong>match level</strong> and in-match XP that climb as you act — its screen shows both instead of gear consumables.</p>'+
 dsc(g,"🔥 Round Active - Choose Action",
  '<p class="dsc__row" style="color:#b5bac1;font-style:italic">The arena narrows. Only one walks out.</p>'+
  '<p class="dsc__row"><span class="dsc__nm">Max</span> (Match Lvl 3) <code>STR:32 AGI:13 CON:12</code>'+
   '<span class="dsc__sub"><span class="bar">'+hpbar(160,200)+'</span> <code>160/200 HP</code> | ⚡ XP: <code>40/100</code></span></p>'+
  '<p class="dsc__row"><span class="dsc__nm">Contender</span> (Match Lvl 2) <code>STR:18 AGI:15 CON:10</code>'+
   '<span class="dsc__sub"><span class="bar">'+hpbar(90,180)+'</span> <code>90/180 HP</code> | ⚡ XP: <code>25/100</code></span></p>',
  "💤 Rest: Heal for +15 HP +15 XP\n⏰ 2 Minutes to choose.")+
 '<p class="embcap">Attacking and killing feed the XP bar; hit 100 and your match level ticks up for a small mid-fight boost. It resets when the match ends — only the winner keeps global XP.</p>'+

 '<h2 class="s">Horde &amp; the shared-engine extras</h2>'+
 '<p class="b">The modes that field NPC allies or waves add fields <em>onto</em> the team screen. Horde shows both an <strong>Ally Plan</strong> (what the NPCs intend this round) and <strong>Horde Progress</strong> (the wave counter). Escort and Mission add the same Ally Plan plus a <strong>🛡️ Protect NPC</strong> action.</p>'+
 dsc(teal,"⚔️ Combat Phase - Choose Action",
  '<p class="dsc__hd">🟦 Survivors</p>'+
  '<p class="dsc__row"><span class="dsc__nm">• Max</span> ⏳'+
   '<span class="dsc__sub"><span class="bar">'+hpbar(155,230)+'</span> <code>155/230 HP</code></span>'+
   '<span class="dsc__sub"><code>STR:32 AGI:13 CON:12</code></span>'+
   '<span class="dsc__sub"><code>Item:Team Heal +45 (3 lowest)</code></span></p>'+
  '<p class="dsc__hd">🟥 The Horde</p>'+
  '<p class="dsc__row"><span class="dsc__nm">• Ravager</span> 🔥'+
   '<span class="dsc__sub"><span class="bar">'+hpbar(120,160)+'</span> <code>120/160 HP</code></span></p>'+
  '<p class="dsc__fn">🧭 Ally Plan</p>'+
  '<p class="dsc__row" style="color:#b5bac1;font-size:.82rem">🤝 Field Medic → heals the lowest ally · 🤝 Recruit → attacks Ravager</p>'+
  '<p class="dsc__fn">🧱 Horde Progress</p>'+
  '<p class="dsc__row" style="color:#b5bac1;font-size:.82rem">Wave 4 / 8 · rewards scale with the wave</p>'+
  '<p class="dsc__fn">⚡ Enemy NPC Passive Abilities</p>'+
  '<p class="dsc__row" style="color:#b5bac1;font-size:.82rem">🔥 Enrage — deals 1.5× damage below 30% HP</p>',
  "Select the name of the enemy you want to ATTACK.\n⏰ 2 Minutes to choose.")+
 '<p class="embcap">These extra fields are the only real difference between the group modes. Underneath, it is the same combatant rows as the team screen at the top.</p>'+

 '<h2 class="s">The Eternal Abyss</h2>'+
 '<p class="b">The dungeon draws its own screen: a <strong>score and gold</strong> header, the run\'s class icons on each player, and dungeon-only status like momentum stacks and stun.</p>'+
 dsc(purple,"⚔️ Ossuary — Turn 5",
  '<p class="dsc__row" style="font-size:.84rem">📊 <strong style="color:#f2f3f5">12,400</strong> pts  ×1.4  |  💰 <strong style="color:#f2f3f5">850</strong> Gold</p>'+
  '<p class="dsc__row" style="color:#b5bac1;font-size:.82rem;font-style:italic">The Specter takes the hit and does not flinch. Only Focus bites it.</p>'+
  '<p class="dsc__fn">👤 TEAM</p>'+
  '<p class="dsc__row"><span class="dsc__nm">• ⚔️ Max</span> ✅ <span class="bar">'+hpbar(180,240)+'</span> <code>180/240 HP</code>'+
   '<span class="dsc__sub"><code>STR:15 AGI:9 CON:12</code>  [⚡×2]</span></p>'+
  '<p class="dsc__row"><span class="dsc__nm">• 🛡️ Bulwark</span> ⏳ <span class="bar">'+hpbar(90,300)+'</span> <code>90/300 HP</code>'+
   '<span class="dsc__sub"><code>STR:10 AGI:6 CON:20</code>  [💤 STUNNED(1)]</span></p>'+
  '<p class="dsc__row"><span style="color:#949ba4">🔴 Ghost — DOWNED, 2 turns before death</span></p>',
  "Choose your move carefully.\n⏰ 2 Minutes to choose.")+
 '<p class="embcap">The class icon (⚔️ Devastator, 🛡️ Colossus, 👻 Ghost…) sits on every name. <code>⚡×2</code> is a Devastator\'s momentum stack; a downed player has a countdown before death that a revive can still beat.</p>'+

 '<h2 class="s">Pokemax battles</h2>'+
 '<p class="b">Pokemax get their own brown embed — no STR/AGI/CON here. Each side shows its active Pokemax\'s <strong>level, type and HP</strong>. The public panel carries the turn log, both rosters and who has locked their move; you pick from private controls.</p>'+
 dsc(brown,"⚔️ Safari — Round 1",
  '<p class="dsc__fn">Max</p>'+
  '<p class="dsc__row"><span class="dsc__nm">🦎 Cinderling</span>  Lv.5  🔥Fire'+
   '<span class="dsc__sub">HP <span class="bar">'+petbar(33,33)+'</span>  33/33</span></p>'+
  '<p class="dsc__fn">🌿 Wild</p>'+
  '<p class="dsc__row"><span class="dsc__nm">🐕 Emberpup</span>  Lv.5  🔥Fire'+
   '<span class="dsc__sub">HP <span class="bar">'+petbar(24,24)+'</span>  24/24</span></p>'+
  '<p class="dsc__fn">📜 Turn Log</p>'+
  '<p class="dsc__row" style="color:#b5bac1;font-size:.82rem">A wild 🐕 Emberpup (Lv.5) appeared!<br>Safari, trainer and event battles carry your party over — the HP and Move Uses it walks in with are the ones it walked out with last time.</p>'+
  '<p class="dsc__fn">Teams</p>'+
  '<p class="dsc__row" style="font-size:.84rem"><span class="dsc__nm">Max</span><br>▶ 🦎 Cinderling · 33/33 HP</p>'+
  '<p class="dsc__fn">Turn status</p>'+
  '<p class="dsc__row" style="font-size:.84rem"><span class="dsc__nm">Max:</span> ⚙️ Resolving</p>',
  "Open your private controls. You have 120 seconds to choose or lose by AFK.")+
 '<p class="embcap">The bar is <code>▰▱</code> at width 10, not the block bar the rest of the game uses. <code>▶</code> in the Teams roster marks your active Pokemax; a benched one shows <code>•</code>, and a fainted one reads <em>fainted</em>. Your four moves and their PP live in the private controls, not on this public panel.</p>'+

 '<h2 class="s">Mecha duels</h2>'+
 '<p class="b">Wanzers drop the bar-per-fighter layout for a <strong>Front Mission panel</strong>: four parts stacked body-over-arms-over-legs, each with its own HP, plus your <strong>AP</strong> and the weapon each arm is holding.</p>'+
 dsc(blue,"⚙️ Mecha Duel — Choose Action",
  '<div class="dsc__pre">🤖 Striker-01            AP 8/10\n'+
  '━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n'+
  'BODY  '+hpbar(277,277,14)+' 277/277\n'+
  'ARM-L '+hpbar(120,153,14)+' 120/153   🔫 Machinegun (3AP)\n'+
  'ARM-R '+hpbar(153,153,14)+' 153/153   🎯 Rifle (4AP)\n'+
  'LEGS  '+hpbar(132,132,14)+' 132/132   EVA 44%\n'+
  '━━━━━━━━━━━━━━━━━━━━━━━━━━━━</div>'+
  '<div class="dsc__pre">🤖 Raider-X              AP 6/9\n'+
  '━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n'+
  'BODY  '+hpbar(240,266,14)+' 240/266\n'+
  'ARM-L [   ✕ DESTROYED  ]\n'+
  'ARM-R '+hpbar(60,130,14)+' 60/130   💣 Grenade Launcher (5AP)\n'+
  'LEGS  '+hpbar(40,132,14)+' 40/132   EVA 18%\n'+
  '━━━━━━━━━━━━━━━━━━━━━━━━━━━━</div>',
  "Fire · Guard (+3 AP) · Rest (+6 AP) · Consumable\n⏰ 2 Minutes to choose.")+
 '<p class="embcap">Raider-X is already losing the right way to lose: its left arm is <strong>✕ DESTROYED</strong> so that weapon is gone, and its legs are nearly off, dropping evasion to 18%. Take the other arm next and it cannot fight back at all.</p>'+

 '<div class="callout"><p>Every value on this page — the bar lengths, the stat lines, the field names, the footers — is drawn the way the bot\'s own code draws it. The names and numbers are illustrative; the layout is not.</p></div>';
}};

PAGES.abyss={t:"The Eternal Abyss",e:"The dungeon",d:"A 1–3 player roguelite, and the deepest single mode in the game. Every run is different.",h:function(){
 return '<h2 class="s">Structure</h2>'+
 '<span class="fx">class pick → rooms → partial heal → choice events → final boss</span>'+
 '<p class="b">Multiple rooms with a partial heal between them, narrative <strong>choice events</strong> with real consequences, and a boss at the end. You collect relics on the way and pick up curses you did not ask for.</p>'+
 '<h2 class="s">Classes</h2>'+
 tbl(["Class","Stat change","Passive"],CLASSES.map(function(r){return [r[0],r[1],r[2]];}),["k","n",""])+
 '<h2 class="s">Relics</h2>'+
 RELICS.map(function(r){return '<h3 class="t">'+E(r[0])+'</h3><p class="b">'+E(r[1])+"</p>";}).join("")+
 '<h2 class="s">Curses</h2>'+
 '<p class="b">Team penalties you accumulate — and the Hexblade\'s entire power source, at <strong>+18% damage per active curse</strong>.</p>'+
 tbl(["Curse","Effect"],CURSES.map(function(r){return [r[0],r[1]];}),["k",""])+
 '<h2 class="s">Pacts and Heat</h2>'+
 '<p class="b">Optional difficulty you turn on <em>before</em> entering, for a bigger reward multiplier. <strong>Heat</strong> is simply how many pacts you took.</p>'+
 tbl(["Pact","What it does","Multiplier"],PACTS.map(function(r){return [r[0],r[1],r[2]];}),["k","","n"])+
 tbl(["Heat","Total reward multiplier"],[["1","×1.4"],["2","—"],["3","—"],["4","—"],["5","×4.0 · <em>Abyss Legend</em>"]],["n",""])+
 '<h2 class="s">What lives down there</h2>'+
 tbl(["Enemy","What makes it a problem"],ABYSSFOES.map(function(r){return [r[0],r[1]];}),["k",""])+
 '<div class="callout"><p><strong>The run-winning combo:</strong> Hexblade plus <em>The Black Crown</em> turns every curse into a buff. Bring <em>Soul Bond</em> on Death Pact runs. Save Focus for Specters — normal hits do nothing to them.</p></div>';
}};

PAGES.clans={t:"Clans",e:"The guide",d:"Permanent groups that grant collective passive bonuses, hold territory, and unlock their own forge recipes.",h:function(){
 return '<h2 class="s">Founding one</h2>'+
 tbl(["Rule","Value"],[["Creation cost","12,500 Oil Coins"],["Max members","15"],["Re-join cooldown after leaving","72 hours"],["Invite expiry","72 hours"],["Active passives at once","2 of 9"],["Upgrade levels per passive","5"]],["k","n"])+
 '<div class="callout"><p><strong>Join a clan before you found one.</strong> Enjoy the passives for a while before you spend 12,500 OIL finding out which two you actually want.</p></div>'+
 '<h2 class="s">Roles</h2>'+
 tbl(["Role","Permissions"],[["Owner","Full control — passives, invites and kicks, treasury"],["Sub Leader","Invite, manage daily missions"],["Member","Participate and benefit from passives"]],["k",""])+
 '<h2 class="s">The nine passives</h2>'+
 '<p class="b">Only <strong>two are active at once</strong>. Each has 5 upgrade levels paid from the clan treasury; the values below are at level 5.</p>'+
 tbl(["Passive","At level 5","Best for"],CLANPASS.map(function(r){return [r[0],r[1],r[2]];}),["k","",""])+
 '<div class="callout"><p><strong>Oathbound Link</strong> only fires with <strong>3+ members of the same clan on the same team</strong>. It is worthless unless you coordinate who queues together.</p></div>'+
 '<h2 class="s">Treasury, missions and forge</h2>'+
 '<p class="b">Your clan has shared <strong>daily objectives</strong> — win X of a mode, earn X Oil collectively — that pay the treasury in Oil and members in XP. The treasury funds passive upgrades and <strong>Clan Forge</strong> recipe unlocks, which gate six gear pieces and two weapons behind the clan rather than the player.</p>'+
 '<p class="b">Clans also hold <strong>territory</strong>, which grants passive combat bonuses inside the zones they control.</p>';
}};

PAGES.factions={t:"Factions",e:"The world",d:"The powers of Valestia, as the Codex records them. Ranked by how much of the board each one actually occupies.",h:function(){
 return '<p class="b">Every enemy, ally and artifact you meet is filed under a faction in your <strong>Codex</strong>. The counts below are live — they are how many cards each power currently holds, which is a fair measure of how much of Valestia belongs to it.</p>'+
 '<div class="grid grid--wide">'+FACTIONS.map(function(f){
  return '<div class="card"><div class="card__h"><span class="card__n">'+E(f[0])+'</span>'+
   (f[1]?'<span class="card__tag">'+f[1]+' cards</span>':'<span class="card__tag card__tag--clan">no cards yet</span>')+'</div>'+
   '<div class="card__st">'+E(f[2])+'</div><div class="card__d">'+E(f[3])+"</div></div>";
 }).join("")+"</div>"+
 '<h2 class="s">Reputation and contracts</h2>'+
 '<p class="b">Separate from the Codex, a handful of guilds track your <strong>reputation</strong> and issue <strong>contracts</strong>. Completing one grants Oil, XP and standing, and may cost you standing with a rival. Contracts have minimum reputation requirements, and some need a Guild Contract item to start.</p>'+
 '<p class="b">Three are in real use right now: the <strong>Guardians of the Order</strong>, the <strong>Merchants Guild</strong> and the <strong>Bandits Guild</strong>. Check where you stand with <span class="cmd">!guilds</span>.</p>'+
 '<div class="callout"><p>The <strong>Guardians of the Order</strong> are the order your own title comes from. Gorim called you one of the Guardians before you had done a single thing to earn it.</p></div>';
}};

PAGES.economy={t:"Economy &amp; Progression",e:"The guide",d:"Two currencies, a card collection, achievements that pay, and seasons that take nothing away from you.",h:function(){
 return '<h2 class="s">Currencies</h2>'+
 '<div class="grid">'+
 '<div class="card"><div class="card__h"><span class="card__n">Oil Coins</span><span class="card__tag">OIL</span></div><div class="card__d">The main currency. Earned from most modes, daily message activity, and events. Spent on potions, crafting, enhancement, the roulette, founding a clan (12,500) and clan upgrades.</div></div>'+
 '<div class="card"><div class="card__h"><span class="card__n">War Oil</span></div><div class="card__d">Secondary currency from large-scale combat — Castle Siege and War. Used for siege and war progression.</div></div>'+
 '</div>'+
 '<h2 class="s">Codex</h2>'+
 '<p class="b">A collection of cards you unlock as you play — enemies, gear, regions, allies and artifacts. Each has a discovery tier and a deeper <strong>tactical note</strong> you only unlock by fighting the thing enough. It is both a reference and a completion goal, and it pays XP and Oil as you fill it.</p>'+
 '<h2 class="s">Badges</h2>'+
 '<p class="b">Achievements for hitting milestones — crit counts, wins, and other tracked stats. Some grant small combat bonuses such as crit or dodge chance.</p>'+
 '<h2 class="s">Seasons and medals</h2>'+
 '<p class="b">When a season changes, the server takes a <strong>snapshot</strong> and awards medals for the level milestones you crossed.</p>'+
 tbl(["Level reached","Medal"],[["10","Bronze"],["20","Silver"],["30","Gold"],["40","Diamond"]],["n","k"])+
 '<div class="callout"><p><strong>A season change does not reset your character.</strong> Nothing is wiped, nothing is taken. It records where you finished and rewards the milestones you crossed. View a season card with <span class="cmd">!profile @user s1</span>.</p></div>'+
 '<h2 class="s">Bonds</h2>'+
 '<p class="b">Bonds track <strong>relationships between players</strong>. Playing with — or against — the same people builds a shared history. Check yours with <span class="cmd">!bonds</span>, notable ones with <span class="cmd">!bonds_top</span>, and the log with <span class="cmd">!bonds_history</span>.</p>'+
 '<p class="b">Bonds are also a currency. At the <strong>Weapon Forge</strong>, <strong>100 Bonds</strong> permanently unlocks either of two weapon recipes — <a href="#weapons"><strong>Revenant Edge</strong></a> and <strong>Requiem Aegis</strong> — both built around a fallen ally\'s spirit. Unlock once, then craft and enhance them like any other weapon.</p>';
}};

PAGES.pets={t:"The Pokemax System",e:"Pokemax",d:"Catch wild animals across Valestia, raise them to level 50 through two evolutions, and fight 3-versus-3. A whole monster-battler living inside the RPG, sharing none of its combat rules.",h:function(){
 return '<h2 class="s">A different game</h2>'+
 '<p class="b">Pokemax shares <strong>nothing</strong> with normal combat. No STR/AGI/CON, no Focus, no Parry, no gear. A Pokemax has <strong>four stats</strong>, a <strong>type</strong>, up to <strong>four moves</strong> with limited uses, and it faints. You fight <strong>3 versus 3</strong>.</p>'+
 '<p class="b">You catch them wild in the regions of Valestia. Each region breeds its own type: <strong>84 species</strong> across <strong>28 animal families</strong>, every family a three-stage evolution line.</p>'+
 tbl(["Rule","Value"],[
  ["Level cap","50"],["Evolutions","At level 16 and again at 36"],["Party size","3"],
  ["Moves per Pokemax","4 — learning a 5th means forgetting one"],["Genes per Pokemax","4 (HP / ATK / DEF / SPD), each 0–15"],
  ["Safari runs","5 per day"],["Training duels","3 per day"],["Sparring","Unlimited"]
 ],["k","n"])+
 '<h2 class="s">The loop</h2>'+
 '<p class="b"><strong>1 — Pick a starter.</strong> <strong>Cinderling</strong> (Fire), <strong>Pebblecrab</strong> (Water) or <strong>Leafkit</strong> (Grass). The classic trio, and the classic triangle — each beats one of the others.</p>'+
 '<p class="b"><strong>2 — Travel, then Safari.</strong> Safari draws from the region you are physically standing in, so <span class="cmd">!travel</span> is part of the Pokemax loop. Want an Ice Pokemax? Go to Rocky Chill Pass. There is no other way.</p>'+
 '<p class="b"><strong>3 — Chip, status, catch.</strong> Never throw an OILball at a healthy Pokemax. See <a href="#catching">Catching</a>.</p>'+
 '<p class="b"><strong>4 — Battle to level.</strong> Training duels pay XP to both trainers and OIL to the winner. Evolution is automatic.</p>'+
 '<p class="b"><strong>5 — Release your rejects</strong> for Gene Essence, and spend it improving the keepers. See <a href="#genes">Genes &amp; Essence</a>.</p>'+
 '<h2 class="s">Playing it</h2>'+
 tbl(["Command","What it does"],[
  ['<span class="cmd">!safari</span>',"Go looking for wild Pokemax in the region you are standing in. <strong>5 per day.</strong>"],
  ['<span class="cmd">!pets</span>',"Your collection."],
  ['<span class="cmd">!pet_party</span>',"Set the three that fight."],
  ['<span class="cmd">!pet_name</span>',"Nickname a Pokemax."],
  ['<span class="cmd">!pet_train @user</span>',"A training duel. Both trainers earn XP. <strong>3 per day.</strong>"],
  ['<span class="cmd">!pet_spar @user</span>',"A friendly fight. No XP, no limit, no cost."],
  ['<span class="cmd">!collars</span> · <span class="cmd">!pet_shop</span>',"Buy OILballs, potions, revives and ethers."],
  ['<span class="cmd">!petpanel</span>',"The button hub for all of it."]
 ],["k",""])+
 '<p class="b">A Safari encounter runs on a <strong>2 minute turn timer</strong>. Wild Pokemax use a simple AI that picks its best damage; trainer battles run a smarter one that reads matchups.</p>'+
 '<h2 class="s">The shop</h2>'+
 tbl(["Item","Price","Max held","Effect"],PET_SUPPLIES.map(function(s){
  return [s[0],s[1].toLocaleString()+" OIL",s[2],s[3]];
 }),["k","n","n",""])+
 '<p class="b">The hold caps are the real constraint. Ten OILballs of each kind, three revives, two Max Ethers — you cannot stockpile your way out of a bad Safari run.</p>'+
 '<h2 class="s">Levelling and evolution</h2>'+
 '<span class="fx">XP to reach the next level = 15 + (current level × 10)</span>'+
 '<p class="b">A linear curve, so the grind never becomes a wall — level 49 to 50 costs 505 XP, not tens of thousands. Battle XP is <span class="cmd">10 + (average foe level × 3)</span>, and the winning trainer also takes <strong>OIL worth triple the XP</strong>, which makes Pokemax a real income stream and not just a side toy.</p>'+
 '<p class="b">Evolution happens automatically at <strong>16</strong> and <strong>36</strong> — no stones, no trades. Each stage jumps the base block: <strong>46% → 72% → 100%</strong>. Watch it happen in the <a href="#lab">Pokemax Lab</a>.</p>'+
 '<div class="callout"><p>Levelling past an evolution keeps teaching moves, and if all four slots are full the new move goes to a <strong>pending queue</strong> rather than being lost. You choose later, in the open. A forgotten move can be bought back at the <strong>Move Reminder</strong> for <strong>2,000 OIL</strong>.</p></div>';
}};

PAGES.lab={t:"Pokemax Lab",e:"Pokemax",d:"Every species by name — its type, role, exact stats at any level and gene roll, evolution line, and full moveset. The same formulas the bot runs.",h:function(){
 return '<div class="lab">'+
  '<div class="lab__ctl">'+
   '<div class="lab__f"><label class="lab__l" for="labSp">Species</label>'+
    '<select class="lab__sel" id="labSp"></select></div>'+
   '<div class="lab__f"><label class="lab__l" for="labLv">Level <b class="num" id="labLvV">50</b></label>'+
    '<input class="lab__rng" type="range" id="labLv" min="1" max="50" value="50"></div>'+
   '<div class="lab__genes" id="labGenes"></div>'+
   '<div class="lab__btns">'+
    '<button class="lab__b" id="labPerfect">Perfect 15s</button>'+
    '<button class="lab__b" id="labRoll">Random roll</button>'+
    '<button class="lab__b" id="labZero">All zeros</button>'+
   '</div>'+
   '<p class="lab__q" id="labQ"></p>'+
  '</div>'+
  '<div class="lab__out">'+
   '<div class="lab__id" id="labId"></div>'+
   '<div class="ro" id="labStats"></div>'+
   '<div class="lab__chain" id="labChain"></div>'+
   '<h3 class="t" style="margin-top:1.4rem">Moves known at this level</h3>'+
   '<div class="lab__moves" id="labMoves"></div>'+
   '<p class="lab__note" id="labNote"></p>'+
   '<h3 class="t" style="margin-top:1.4rem">Full learnset — every ability it can learn</h3>'+
   '<div class="lab__learn" id="labLearn"></div>'+
  '</div>'+
 '</div>'+
 '<h2 class="s">How to read it</h2>'+
 '<p class="b">The stat bars compare this Pokemax against the <strong>strongest final-stage Pokemax in the game</strong> for that stat, so a full bar means nothing else beats it. The grey ghost behind each bar is the same Pokemax with <strong>zero genes</strong> — the gap is what your roll is worth.</p>'+
 '<p class="b">Drag the level past <strong>16</strong> and <strong>36</strong> and the Pokemax evolves in front of you, base stats and all. That is exactly what happens in a battle.</p>'+
 '<div class="callout"><p>Moves known are the <strong>last four learned at or below</strong> the current level — the same rule the bot uses. Raise the level and watch an early move fall off the list. The <strong>Full learnset</strong> below it lists <em>every</em> move the Pokemax can learn and the level it comes at, with power, PP and effect — dimmed rows are ones it has not reached yet.</p></div>';
}};

PAGES.species={t:"Species &amp; Evolution",e:"Pokemax",d:"84 species, 28 families, nine regions. Every family is one animal with three stages, and every region breeds one type.",h:function(){
 var names={starter_ruins:"Starter Ruins",crimson_plain:"Crimson Plain",stormbay_docks:"Stormbay Docks",
  rocky_chill_pass:"Rocky Chill Pass",black_lotus_wood:"Black Lotus Wood",ravencraft:"Ravencraft",
  mist_forest:"The Mist Forest",bandit_caves:"Bandit Caves",dark_knight_sanctum:"Dark Knight's Sanctum"};
 var fams=PET_FAMS.map(function(r){
  var emo={fire:"🔥",water:"💧",grass:"🌿",ice:"❄️",rock:"🪨",flying:"🦅",ghost:"👻",dark:"🌑"}[r[1]];
  return '<div class="card"><div class="card__h"><span class="card__n">'+E(names[r[0]])+'</span>'+
   '<span class="card__tag">'+emo+" "+E(r[1])+'</span></div>'+
   r[2].map(function(f){
    return '<p class="sp" style="margin-top:.5rem"><span class="sp__a">'+f[0]+" "+E(f[1])+
     ' · final base '+f[3].join("/")+'</span><span class="sp__n">'+E(f[2])+"</span></p>";
   }).join("")+"</div>";
 });
 return '<p class="b">Each family is <strong>one animal with three stages</strong>. Below is every family, its role, and the <strong>final stage</strong>\'s base stats as <span class="cmd">HP/ATK/DEF/SPD</span> — the numbers that define what the line is for. The earlier two stages are the same shape scaled down, at <strong>46%</strong> and <strong>72%</strong> of the final block.</p>'+
 '<div class="callout"><p>🔬 <strong>Want one Pokemax\'s full profile?</strong> The <a href="#lab">Pokemax Lab</a> shows any species by <strong>name</strong>, with its <strong>type, role and exact stats</strong> at any level and gene roll, its <strong>evolution line</strong>, and its <strong>complete learnset — every move it learns and when</strong>, with each move\'s power, PP and effect.</p></div>'+
 '<div class="grid grid--wide">'+fams.join("")+"</div>"+
 '<div class="callout"><p><strong>Merchant Crossroads has no native species.</strong> Its encounters are drawn from Starter Ruins, Crimson Plain and Stormbay Docks — it is a crossroads in the literal sense.</p></div>'+
 '<h2 class="s">Roles</h2>'+
 '<p class="b">Every family is built to one of six shapes. The count is how many species carry it.</p>'+
 tbl(["Role","Species","What it is for"],PET_ROLES.map(function(r){return [r[0],r[1],r[2]];}),["k","n",""])+
 '<div class="callout"><p><strong>Speed decides fights.</strong> Sweepers hit 133–138 base speed and win the turn. Walls sit at 35–55 and simply never go first — a wall only works if it survives the alpha strike, and against a super-effective STAB hit it will not.</p></div>';
}};

PAGES.genes={t:"Genes &amp; Essence",e:"Pokemax",d:"Four hidden numbers rolled the moment you catch a Pokemax, and the only currency that can move them.",h:function(){
 return '<h2 class="s">What a gene is</h2>'+
 '<p class="b">Every Pokemax rolls <strong>four genes</strong> at the moment you catch it — one per stat, each a hidden <strong>0 to 15</strong>. They are permanent, they never change with level, and they are the difference between two Pokemax of the same species being identical or one being clearly better.</p>'+
 '<span class="fx">max HP = floor(base_hp × level ÷ 50) + level + 10 + gene</span>'+
 '<span class="fx">atk / def / spd = floor(base × level ÷ 50) + 5 + gene</span>'+
 '<p class="b">At level 50 a gene is worth a flat <strong>+15</strong>. That is enormous on a stat that lands around 60 — a perfect-gene Pokemax is roughly <strong>25% stronger</strong> than a zero-gene one of the same species. This is the entire reason to keep hunting a species you already own.</p>'+
 '<p class="b">See the gap for yourself in the <a href="#lab">Pokemax Lab</a>: set a Pokemax to level 50 and slide the genes from 0 to 15.</p>'+
 tbl(["Gene value","Quality"],[["0–4","Poor"],["5–8","Average"],["9–11","Good"],["12–13","Excellent"],["14–15","Exceptional"]],["n","k"])+
 '<div class="callout"><p>Genes are <strong>hidden until you scan them</strong>. A wild Pokemax looks identical whether it rolled 2s or 15s — the scan is how you find out before you spend an OILball.</p></div>'+
 '<h2 class="s">Gene Essence</h2>'+
 '<p class="b">A separate currency, and it has exactly one source: <strong>releasing a Pokemax</strong>. The better its genes, the more it pays. You cannot release your last Pokemax.</p>'+
 tbl(["Sum of the 4 genes","Quality","Essence paid"],[
  ["0–19","Poor","1"],["20–31","Average","2"],["32–43","Good","3"],["44–52","Excellent","4"],["53–60","Exceptional","5"]
 ],["n","k","n"])+
 '<h2 class="s">What you can spend it on</h2>'+
 tbl(["Operation","Cost","What it does"],PET_GENE_OPS.map(function(o){return [o[0],o[1]+" essence",o[2]];}),["k","n",""])+
 '<div class="callout callout--warn"><p><strong>The economy is deliberately brutal.</strong> A Poor Pokemax pays 1 essence. Gene Training costs 20 and is capped at 5 per Pokemax, ever. So perfecting one Pokemax by hand means releasing <em>twenty</em> bad ones — and it still only buys 5 points out of a possible 60.</p>'+
 '<p>Catching a good roll will always beat grinding a bad one into shape. That is the point: the Safari is the game, not the workbench.</p></div>'+
 '<h2 class="s">Advice</h2>'+
 '<p class="b"><strong>Scan before you throw.</strong> 10 essence is cheap next to a 3,000 OIL Prime OILball spent on a Poor roll.</p>'+
 '<p class="b"><strong>Release your rejects.</strong> A Poor Pokemax sitting in your box is 1 essence you have not banked.</p>'+
 '<p class="b"><strong>Spend Training on the stat that matters</strong>, not evenly. A sweeper wants SPD; a wall wants HP and DEF. Five points into the right stat beats five spread thin.</p>';
}};

PAGES.petbattle={t:"Pokemax Battles",e:"Pokemax",d:"Eight types, 61 moves, five status conditions, and multipliers that stack hard enough to end a fight in one hit.",h:function(){
 return '<h2 class="s">The type chart</h2>'+
 '<p class="b">Eight types. Super effective is <strong>×2</strong>, resisted is <strong>×½</strong>, and there is no immunity — everything can hurt everything. Read a row as: what this type <strong>deals</strong>, what it is <strong>weak to</strong>, and what it shrugs off.</p>'+
 tbl(["Type","Hits ×2","Takes ×2 from","Resists ×½"],PET_CHART.map(function(c){
  var chip='<span class="tychip tychip--'+c[0]+'">'+c[1]+" "+c[0].charAt(0).toUpperCase()+c[0].slice(1)+'</span>';
  return [chip,c[2],c[3],c[4]];
 }),["","","",""])+
 '<div class="callout"><p><strong>Rock is the offensive anomaly:</strong> it hits Fire, Ice and Flying for ×2 and <em>nothing resists it</em> — every Rock move lands at full value or better. But it is no fortress: <strong>Water and Grass both hit Rock for ×2</strong>, so lead with it, do not tank with it. It is also the only type two regions breed — Starter Ruins and Bandit Caves.</p>'+
 '<p><strong>Dark is the defensive anomaly:</strong> <em>nothing</em> hits Dark for ×2, and Dark resists both itself and Ghost. Paired with the closed Ghost/Dark loop — Ghost only beats Ghost, Dark only beats Ghost — a Dark Pokemax walks through the Mist Forest unopposed.</p></div>'+
 '<h2 class="s">Damage</h2>'+
 '<p class="b">A hit starts from the move\'s power, your Pokemax\'s attack and the target\'s defence, and is then multiplied:</p>'+
 tbl(["Multiplier","Value","When"],[
  ["STAB","×1.5","The move's type matches the Pokemax's type"],
  ["Super effective","×2","See the chart above"],
  ["Resisted","×0.5","See the chart above"],
  ["Critical","×1.5","6% chance, every hit"]
 ],["k","n",""])+
 '<p class="b">Pokemax battles are <strong>short and decisive</strong> by design — every turn is a message in a channel, so fights are tuned to end rather than grind. A super-effective STAB finisher can knock out a frail same-level foe in one hit and a bulky one in two. Type matchups decide fights outright instead of shaving percentages.</p>'+
 '<div class="callout"><p>Stack them and it compounds fast: <strong>STAB × super effective × crit = ×4.5</strong>. Bringing the right type is worth more than bringing the better Pokemax.</p></div>'+
 '<h2 class="s">Moves</h2>'+
 '<p class="b"><strong>61 moves</strong> — 49 that deal damage and 12 that do not. Every move has limited <strong>PP</strong>, and when a Pokemax runs out of everything it is reduced to <strong>Struggle</strong> (40 power, typeless). Moves carry <strong>priority</strong>: a priority move goes first regardless of speed, which is how a slow Pokemax steals a kill.</p>'+
 '<p class="b">A Pokemax holds <strong>four</strong>, and they are the last four it learned. Browse any species\' full learnset in the <a href="#lab">Pokemax Lab</a>.</p>'+
 '<h3 class="t">Status conditions</h3>'+
 tbl(["Status","Effect"],PET_STATUS.map(function(s){return [s[1]+" "+s[0],s[2]];}),["k",""])+
 '<p class="b">Status is not just chip damage — it is <strong>how you catch things</strong>. See <a href="#catching">Catching</a>.</p>'+
 '<h2 class="s">Building a team</h2>'+
 '<p class="b"><strong>Build for coverage, not for power.</strong> Three Pokemax, three types that cover each other. A team of three Fire Pokemax loses to one Water wall.</p>'+
 '<p class="b"><strong>Rock is the strongest opener</strong> — nothing resists it and it comes out of the beginner region — but keep a second Pokemax for the Water and Grass types that hit it back for ×2. Rock leads; it does not soak.</p>'+
 '<p class="b"><strong>Bring one answer to speed.</strong> A priority move, or a Pokemax fast enough to trade with a sweeper. Otherwise the first hit is always theirs.</p>'+
 '<h2 class="s">Between battles</h2>'+
 '<p class="b">There is no grace period. Whether your party carries its wounds into the next fight depends entirely on <strong>where</strong> you fight:</p>'+
 tbl(["Where you fight","Your party starts…"],[
  ['<strong>Safari</strong>, <strong>NPC trainers</strong>, <strong>special events</strong>',"exactly as it ended — <strong>HP and Move Uses carry over</strong> and every point of damage and every spent Move Use is saved to your roster."],
  ['<strong>Gyms</strong>, <strong>PvP</strong>, everything else',"<strong>full HP and full Move Uses</strong>, every time. Nothing from these fights is written back — win or lose, your roster is untouched."]
 ],["k",""])+
 '<p class="b">So a long Safari is a war of attrition: chip through enough wild Pokemax and NPC trainers and your team walks into the next encounter already hurt, low on Move Uses, maybe a body down. That is the tax of staying out. Manage it and the Safari opens up; ignore it and a Lv.5 Emberpup finishes what a boss started.</p>'+
 '<p class="b"><strong>Getting your condition back.</strong> Rest at a <strong>Pokemax Center</strong> — a territory building that restores HP and Move Uses, and heals more the higher its level (a high enough one patches up your whole roster, not just your active party). Or carry it with you: <strong>Potions</strong> and <strong>Revives</strong> for HP, <strong>Ethers</strong> and <strong>Max Ethers</strong> for Move Uses, all stocked from the <a href="#pets">shop</a>. The hold caps on those items mean you cannot simply out-item a bad run.</p>';
}};

PAGES.catching={t:"Catching",e:"Pokemax",d:"The Safari, the OILballs, and the formula that decides whether the thing you just fought is yours.",h:function(){
 return '<h2 class="s">The Safari</h2>'+
 '<p class="b"><span class="cmd">!safari</span> looks for wild Pokemax in the region you are <strong>physically standing in</strong>. Five runs a day. Each region breeds one type, so where you stand decides what you meet — travel is part of the loop.</p>'+
 '<h2 class="s">The formula</h2>'+
 '<p class="b">The classic one, and every term in it is something you control:</p>'+
 '<span class="fx">chance = ((3·maxHP − 2·currentHP) × catch_rate × OILball × status) ÷ (3·maxHP × 255)</span>'+
 tbl(["What you do","Multiplier"],[
  ["Basic OILball","×1.0"],["Fine OILball","×1.5"],["Prime OILball","×2.5"],
  ["Asleep or frozen","×2.0"],["Burned, poisoned or paralysed","×1.5"]
 ],["k","n"])+
 tbl(["Wild Pokemax","Catch rate","Meaning"],[
  ["Stage 1","200","Easy"],["Stage 2","120","Awkward"],["Stage 3","60","Hard"],
  ["Anything in Dark Knight's Sanctum","× 0.5","Half. The endgame region is deliberately miserable."]
 ],["k","n",""])+
 '<div class="callout"><p><strong>The play is always the same:</strong> chip it to a sliver, put it to sleep or freeze it (×2), then throw a Prime OILball (×2.5). That is <strong>×5</strong> on top of a nearly-empty HP bar. Throwing OILballs at a healthy Pokemax is how you run out of OILballs.</p>'+
 '<p>The floor is <strong>3%</strong> — nothing is ever truly impossible. The ceiling is 100%.</p></div>'+
 '<h2 class="s">OILballs</h2>'+
 tbl(["OILball","Price","Max held","Multiplier"],[
  ["🎀 Basic OILball","1,000 OIL","10","×1.0"],["🎀 Fine OILball","1,800 OIL","10","×1.5"],["🎀 Prime OILball","3,000 OIL","10","×2.5"]
 ],["k","n","n","n"])+
 '<p class="b">Ten of each, maximum. A Prime OILball costs three times a Basic and buys you two and a half times the odds — worth it on a stage-3 target, wasteful on a stage-1.</p>'+
 '<div class="callout"><p><strong>Scan first.</strong> 10 Gene Essence tells you whether the Pokemax in front of you is worth a 3,000 OIL OILball at all. Most are not.</p></div>'+
 '<h2 class="s">Route Trainers — the encounter after a Safari</h2>'+
 '<p class="b">The Safari is not the only thing on the route. When you finish a Safari encounter — caught, won or fled — a <strong>wandering trainer</strong> may step out in the region\'s channel and challenge you to a real <strong>3-versus-3 Pokemax battle</strong>. It is the one PvE fight your Pokemax get outside of catching, and there is <strong>one per day</strong>.</p>'+
 '<p class="b">You accept from the offer with <span class="cmd">!route_trainer</span> in that region\'s channel. Decline, and the day\'s offer is gone.</p>'+
 '<h2 class="s">The more you Safari, the surer it gets</h2>'+
 '<p class="b">A trainer is not guaranteed on your first Safari of the day — but the chance climbs with every Safari you run, and by your fifth it is certain:</p>'+
 tbl(["Safari of the day","Trainer appears"],[
  ["1st","15%"],["2nd","30%"],["3rd","45%"],["4th","65%"],["5th","100% — guaranteed"]
 ],["n","n"])+
 '<div class="callout"><p>So the Route Trainer rewards the same habit the Safari does: run all five Safari attempts and you are guaranteed the encounter, on top of five shots at wild Pokemax.</p></div>'+
 '<h2 class="s">Fifty trainers, five per region</h2>'+
 '<p class="b">Each of the ten huntable regions has <strong>five</strong> Route Trainers — <strong>50</strong> in all — and each has a name, a title, a personality and their own Pokemax lineup. Their team <strong>scales to your party\'s average level</strong>, shifted up or down by their difficulty. Meet Milo the Rubble Scout in the Starter Ruins, Bram the Stone Roller, Ordo the Last Sentinel; every region has its own cast.</p>'+
 tbl(["Difficulty","Their team","Level vs you"],[
  ['<strong>Rookie</strong>',"1 Pokemax","Below your average — a warm-up"],
  ['<strong>Specialist</strong>',"3 Pokemax","Around your average — a real fight"],
  ['<strong>Ace</strong>',"3 Pokemax","Above your average — the hard ones"]
 ],["k","n",""])+
 '<h2 class="s">What it pays</h2>'+
 tbl(["Outcome","Reward"],[
  ["Win",'XP = <span class="cmd">12 + (their team\'s average level × 3)</span>, and OIL worth <strong>3×</strong> that XP.'],
  ["First win vs a given trainer",'The same, plus a <strong>+50% OIL bonus</strong> — a one-time reward for each trainer you beat.'],
  ["Loss","You still take <strong>50%</strong> of the XP. Nothing is wasted."]
 ],["k",""])+
 '<div class="callout"><p><strong>This is the Pokemax income engine.</strong> The fifth Safari guarantees a trainer, and the first win over each of a region\'s five trainers pays bonus OIL — so working through a region\'s roster, one trainer a day, is a steady, repeatable payday your creatures earn on their own.</p></div>';
}};

PAGES.mechas={t:"The Mecha System",e:"Mechas",d:"Front Mission in a Discord channel: pilot a wanzer built from four destructible parts, spend Action Points instead of taking free turns, and win by dismantling the enemy machine one limb at a time.",h:function(){
 return '<h2 class="s">A different fight, again</h2>'+
 '<p class="b">Like Pokemax, mechas share nothing with normal combat — no STR/AGI/CON, no Focus, no gear. A <strong>wanzer</strong> is four separate parts, each with its own HP and armor: <strong>body, left arm, right arm, legs.</strong> You do not have one health bar; you have four, and the fight is about which one breaks first.</p>'+
 tbl(["Break this part","And…"],[
  ["An arm","The weapon it holds goes offline. Disarm the enemy by shooting the arm, not the body."],
  ["The legs","Evasion collapses — every shot after that lands far more often."],
  ["The body","The wanzer is destroyed. This is the kill, but it is usually the best-armored part."]
 ],["k",""])+
 '<div class="callout"><p><strong>You rarely win by going for the body.</strong> You win by crippling — take the arms so it cannot shoot back, take the legs so it cannot dodge, then finish at your leisure. A mecha with both arms gone is a loss waiting to happen, even at full body HP.</p></div>'+
 '<h2 class="s">The loop</h2>'+
 '<p class="b"><strong>1 — Open the portal at <a href="#portal">Cape Greyveil</a>.</strong> Mechas are the one system that asks you to have played everything else first — the toll is materials from all over Valestia.</p>'+
 '<p class="b"><strong>2 — <a href="#hangar">Build a wanzer</a></strong> from a body, two arms and legs, staying under your weight budget.</p>'+
 '<p class="b"><strong>3 — Hang two <a href="#mechawpn">weapons</a></strong>, one per arm, and pack two backpack items.</p>'+
 '<p class="b"><strong>4 — <a href="#mechafight">Fight</a></strong> by spending Action Points: cripple the enemy frame part by part.</p>'+
 '<p class="b"><strong>5 — Win to earn <a href="#pilot">Pilot XP</a></strong>, which raises your rank and unlocks higher Marks of parts to build.</p>'+
 tbl(["Rule","Value"],[
  ["Parts per wanzer","4 — body, 2 arms, legs, each destructible"],
  ["Marks (upgrade tiers)","Mk1 → Mk5"],
  ["Weapons equipped","2 — one per arm"],
  ["Backpack slots","2"],
  ["Turn actions","Fire · Guard · Rest · Consumable"]
 ],["k","n"])+
 '<div class="callout"><p>See a mecha duel drawn live on the <a href="#screens">What It Looks Like</a> page — the four-part panel is a screen unlike anything else in the game.</p></div>';
}};

PAGES.portal={t:"The Greyveil Portal",e:"Mechas",d:"Mechas are gated behind Cape Greyveil. Opening the portal is a deliberate endgame commitment — a haul of materials from the whole map, then a duel.",h:function(){
 return '<h2 class="s">Cape Greyveil</h2>'+
 '<p class="b"><strong>Cape Greyveil</strong> has no enemies and no hunting — the only thing there is the <strong>Mecha Portal</strong>. You reach the Cape from Stormbay Docks with <span class="cmd">!travel</span>. It is a portal region, not a place you fight in.</p>'+
 '<h2 class="s">The toll</h2>'+
 '<p class="b">Opening the portal costs materials from all over Valestia, then a fight:</p>'+
 tbl(["The portal toll","Amount"],[
  ["Every region signature material","×5 of each of the 10"],
  ["Rare materials","×10 each — Temporal Gear, Obsidian Alloy, War Emblem Fragment, Null Coil"],
  ["Oil","30,000"],
  ["Lyra's initiation","A mecha duel you have to win"]
 ],["k","n"])+
 '<p class="b">The signature materials come from <span class="cmd">!hunt</span> in each region, so the portal is a reason to have travelled the whole map. It is the one system that asks you to have played everything else first.</p>'+
 '<h2 class="s">Lyra\x27s initiation</h2>'+
 '<div class="callout"><p><strong>Lyra lends you a wanzer for the initiation — and lets you keep it when you win.</strong> A Mk1 Striker frame with a Machinegun and a Rifle, a Repair Kit and an AP Cell in the backpack. Passing pays back <strong>20,000 Oil</strong> and the Pilot role. You are not building your first mecha from nothing; you are earning your way into the hangar.</p></div>'+
 '<p class="b">That starter frame is a Striker — the balanced all-rounder — so your first duel is fought on even, forgiving footing before you start specialising. Once you own it, the <a href="#hangar">hangar</a> is open.</p>';
}};

PAGES.hangar={t:"Building a Wanzer",e:"Mechas",d:"Four parts — a body, two arms, legs — each in an archetype and a Mark, all under a weight budget the frame sets.",h:function(){
 return '<p class="b">You assemble four parts, and each comes in an archetype and a Mark (Mk1–Mk5). The numbers below span <strong>Mk1 → Mk5</strong>; the shape of each archetype stays the same as it upgrades.</p>'+
 '<h2 class="s">Bodies — the frame, your AP ceiling</h2>'+
 tbl(["Body","HP","Armor","Guard %","Output","Max AP"],MECHA_BODIES.map(function(b){
  return ['<strong>'+E(b[0])+'</strong><div class="mode__d">'+E(b[1])+'</div>',b[2],b[3],b[4],b[5],b[6]];
 }),["k","n","n","n","n","n"])+
 '<p class="b"><strong>Output</strong> is your weight budget — a heavier frame hauls heavier weapons. <strong>Max AP</strong> is your ceiling; a Scout thinks faster than a Bastion but folds faster too.</p>'+
 '<h2 class="s">Arms — they hold the weapons, and they break</h2>'+
 tbl(["Arm","HP","Armor","Aim","Weight","Melee"],MECHA_ARMS.map(function(a){
  return ['<strong>'+E(a[0])+'</strong><div class="mode__d">'+E(a[1])+'</div>',a[2],a[3],a[4],a[5],a[6]];
 }),["k","n","n","n","n","n"])+
 '<p class="b">Each arm carries one weapon. <strong>Aim</strong> raises that weapon\x27s hit chance, so a Marksman Arm turns an inaccurate Grenade Launcher into a threat. Lose the arm and you lose the gun — armored arms keep it in the fight longer.</p>'+
 '<h2 class="s">Legs — mobility and footing</h2>'+
 tbl(["Legs","HP","Armor","Evasion","Weight"],MECHA_LEGS.map(function(l){
  return ['<strong>'+E(l[0])+'</strong><div class="mode__d">'+E(l[1])+'</div>',l[2],l[3],l[4],l[5]];
 }),["k","n","n","n"])+
 '<p class="b">Legs are your <strong>evasion</strong> — Scout Legs dodge more than three times as often as Bastion Legs. It is also why blowing off the enemy\x27s legs is such a strong opening: it turns their whole frame into an easy target.</p>'+
 '<h2 class="s">Weight and evasion</h2>'+
 '<p class="b">Everything you bolt on has weight, and your body\x27s <strong>output</strong> is the budget. Pack the frame past its limit and it slows down; pack it past 100% and it simply <strong>will not equip</strong>.</p>'+
 tbl(["Weight vs output","Evasion"],[
  ["Up to 70%","Full — no penalty"],["70% – 85%","×0.80"],["85% – 100%","×0.60"],["Over 100%","Cannot equip"]
 ],["n","n"])+
 '<div class="callout"><p>This is the build puzzle: a Bastion frame can carry the heaviest guns but barely dodges to begin with, so loading it further costs little. A Scout lives on evasion — hang a Maul off it and you throw away the one thing keeping it alive.</p></div>'+
 '<div class="callout"><p><strong>Build to the frame.</strong> Heavy frames want heavy guns and do not miss the evasion; light frames want to stay light and win the turn. Match your <a href="#mechawpn">weapons</a> to the body, not the other way around.</p></div>';
}};

PAGES.mechawpn={t:"Mecha Weapons",e:"Mechas",d:"Seven weapon families, each a different answer to the same question: how do you break four parts before they break yours.",h:function(){
 return '<h2 class="s">The seven families</h2>'+
 '<p class="b">Each arm holds one. Values span Mk1 → Mk5.</p>'+
 tbl(["Weapon","Power","Hits","Accuracy","AP","Ammo","Weight"],MECHA_WEAPONS.map(function(w){
  return [w[0]+' <strong>'+E(w[1])+'</strong><div class="mode__d">'+E(w[2])+'</div>',w[3],w[4],w[5],w[6],w[7],w[8]];
 }),["k","n","n","n","n","n","n"])+
 '<div class="callout"><p><strong>Hits vs Power is the whole design.</strong> The Flamethrower throws six weak jets that scatter across the frame — it shreds several parts at once but bounces off armor. The Maul is one 199-damage swing that breaks anything it touches, if you can afford the 6 AP and it connects. Many-hit weapons cripple; single-hit weapons execute. Most pilots run one of each.</p></div>'+
 '<h2 class="s">Match aim to weapon</h2>'+
 '<p class="b">A weapon\x27s hit chance is its own accuracy plus the <strong>aim</strong> of the arm holding it. A <strong>Marksman Arm</strong> rescues the inaccurate heavy hitters — a Grenade Launcher on a Marksman Arm is a real threat; on a Guardian Arm it whiffs. A steady <strong>Guardian Arm</strong> instead keeps a reliable gun firing after the arm itself has been shot at.</p>'+
 '<h2 class="s">Backpack consumables</h2>'+
 '<p class="b">Two backpack slots. Using one spends your whole turn, so they are emergency tools, not free value.</p>'+
 tbl(["Item","Effect"],MECHA_CONS.map(function(c){return [c[0],c[1]];}),["k",""]);
}};

PAGES.mechafight={t:"Mecha Combat",e:"Mechas",d:"No free turns. Every action spends Action Points, and firing gives none back — the whole fight is an AP economy fought across four destructible parts.",h:function(){
 return '<h2 class="s">Action Points — the whole game</h2>'+
 '<p class="b">This is what makes it Front Mission and not a shooter. You do not get a free turn: every action spends <strong>Action Points</strong>, and firing does not give any back. Your four choices each turn:</p>'+
 tbl(["Action","AP","What it does"],[
  ["Fire","costs AP","Shoot a weapon at a chosen part. Heavy weapons cost more AP than light ones."],
  ["Guard","+3 AP","Brace: reduce incoming damage this turn and bank AP for later."],
  ["Rest","+6 AP","Recover the most AP — but no defense, so you eat whatever comes."],
  ["Consumable","costs the turn","Use a backpack item: repair a part, dump in AP, pop smoke, clear a burn."]
 ],["k","n",""])+
 '<span class="fx">AP: Fire spends · Guard +3 (defended) · Rest +6 (exposed) · ceiling set by your body frame</span>'+
 '<div class="callout"><p><strong>The core tension:</strong> your best weapons are the ones you cannot afford to fire every turn. A Maul costs 6 AP a swing; a Machinegun costs 3. Spend a turn resting to load up for a big hit and you are open for that turn. Guard banks less but keeps you covered. Every turn is that trade.</p></div>'+
 '<h2 class="s">Target the part, not the mecha</h2>'+
 '<p class="b">You do not shoot "the enemy" — you shoot a <strong>part</strong>. Each has its own HP and armor, and breaking each one does something different.</p>'+
 tbl(["Break this part","And…"],[
  ["An arm","The weapon it holds goes offline — this is how you disarm."],
  ["The legs","Evasion collapses; your later shots land far more often."],
  ["The body","The wanzer is destroyed — the kill, but usually the best-armored part."]
 ],["k",""])+
 '<h2 class="s">How to think about it</h2>'+
 '<p class="b"><strong>Cripple, do not brawl.</strong> Two arms down beats half a body bar. Open on whatever keeps them dangerous — the arm holding their heavy gun, or the legs holding their evasion.</p>'+
 '<p class="b"><strong>Match aim to weapon.</strong> A Marksman Arm rescues the inaccurate heavy hitters; a steady Guardian Arm keeps a reliable gun firing after it has been shot at.</p>'+
 '<p class="b"><strong>Respect the AP economy.</strong> Never fire yourself empty in front of a fresh enemy. Bank with Guard when pressured, Rest only when you can afford the exposure.</p>'+
 '<div class="callout"><p>See the four-part panel drawn live on <a href="#screens">What It Looks Like</a> — a wanzer mid-fight with a destroyed arm and failing legs reads the whole story at a glance.</p></div>';
}};

PAGES.pilot={t:"Pilot Ranks",e:"Mechas",d:"You do not buy your way to Mk5 — you fight your way there. Pilot XP from wins gates the highest Mark you can build and equip.",h:function(){
 return '<h2 class="s">The seven ranks</h2>'+
 '<p class="b">You earn <strong>Pilot XP</strong> from wins, and your rank gates the highest Mark of parts you can build and equip.</p>'+
 tbl(["Rank","Pilot XP","Max build","Unlocks"],MECHA_RANKS.map(function(r){
  return [r[0],r[1],r[2],r[3]];
 }),["k","n","n",""])+
 '<h2 class="s">The Mk recipe chain</h2>'+
 '<p class="b">Parts evolve up a <strong>two-branch Mk recipe chain</strong> that <em>consumes</em> the part below it — upgrading a Mk3 arm to Mk4 eats the Mk3. You are always trading up, never hoarding a ladder of spares.</p>'+
 '<div class="callout"><p>The last two ranks, <strong>Ace</strong> and <strong>Wanzer Lord</strong>, unlock <strong>signature Mk5 frames</strong> that lower ranks cannot field at all. The ceiling is a status symbol you have to earn twice: once in XP, once in materials.</p></div>';
}};

PAGES.characters={t:"Characters",e:"Campaign",d:"The people walking the road with you. Portraits and the truth behind them — more will join as the story grows.",h:function(){
 var C=[
  {img:IMG_JESSIE,side:"l",ca:"#4E8FC4",name:"Jessie",role:"Mercenary · Gunslinger",alias:"",
   facts:[["Weapon","A matched pair of revolvers"],["Allegiance","Herself, mostly"],["First seen","Black Lotus Wood"]],
   quote:"Took you long enough to open that.",
   desc:["Hard on the outside, deliberately. Jessie keeps the reputation and the distance as armour — the sharp remark, the loaded pistols, the refusal to explain herself. Underneath it she is loyal and kind and almost never lets it show; her warmth arrives in brief, near-accidental moments she cuts off fast.",
    "She was found as a baby in the Greywood and never learned who her parents were. She grew up hard and left young, and she goes quiet whenever anyone says <strong>Veldran</strong> — the city that raised her, and the man in it who did.",
    "She met the Guardian mid-ambush and has been at their side, more or less on her own terms, ever since. When the fighting is worst, she is the one who blows the flank open — and says one dry line about it afterwards."]},
  {img:IMG_GARRICK,side:"r",ca:"#C88A3C",name:"Garrick",role:"Refugee Leader · Aldenmoor",alias:"",
   facts:[["Weapon","A two-handed maul"],["Allegiance","The people of Aldenmoor"],["First seen","Aldenmoor"]],
   quote:"Fourteen taverns.",
   desc:["Strong, charismatic, and stubbornly optimistic despite everything the road has taken from him. Garrick leads the refugees of Aldenmoor the way a good captain does — from the front, giving everything for his people and expecting to.",
    "He lost his brother on the second failed attempt to reach the city's sealed underground stores, and he still went down into the vault roads himself when it counted. He reads a room like a man sizing up a fight, and he decided he liked Jessie roughly the moment she cut his guilt short with a joke.",
    "He carries a maul most men could not lift and a warmth that survives a settlement full of loss. When the team first walked into Veldran, the loudest city any of them had seen in years, the first thing he did was count the taverns."]},
  {img:IMG_ZOE,side:"l",ca:"#E0663C",name:"Zoe",role:"Jessie's Childhood Friend · Knives",alias:"",
   facts:[["Weapon","Throwing knives — hurled and up close"],["Allegiance","Jessie, absolutely"],["First seen","Veldran"]],
   quote:"That was exciting!",
   desc:["Bright, unhurried and completely fearless, Zoe is already talking before she is through the door and rarely stops. She gets into trouble the way other people breathe — she once ran straight at two armed men in a market and came out of it with a torn sleeve and a look of pure delight.",
    "She is also the most useful person in any room she walks into. Zoe grew up in <strong>Veldran</strong> alongside Jessie and knows the city cold — the council hall's staff and layout, the guest list for the reception, which door from the service hall gets you closest to where it matters. She pays attention to everything, and she is friends with everyone.",
    "She loves Jessie without reservation, and Jessie loves her back and is quietly terrified for her — because Zoe never sees anything coming, and one day she will run at something that does not work out. Jessie fights her joining every step, and lets her stay anyway. That is the whole story of the two of them."]}
 ];
 return '<p class="b">These are the people at the Guardian\'s side through the main story. Three of them are here now; the rest of the cast joins as the campaign is written.</p>'+
 '<div class="charwrap">'+C.map(function(c){
  return '<article class="charcard charcard--'+c.side+' reveal" style="--ca:'+c.ca+'">'+
   '<div class="charcard__art"><img src="'+c.img+'" alt="'+E(c.name)+'" width="720" height="1080" loading="lazy"><span class="charcard__glow"></span></div>'+
   '<div class="charcard__body">'+
    '<p class="charcard__role">'+E(c.role)+'</p>'+
    '<h2 class="charcard__name">'+E(c.name)+(c.alias?' <span class="charcard__alias">'+E(c.alias)+'</span>':'')+'</h2>'+
    '<div class="charcard__facts">'+c.facts.map(function(f){
      return '<div class="cfact"><span class="cfact__k">'+E(f[0])+'</span><span class="cfact__v">'+E(f[1])+'</span></div>';
    }).join("")+'</div>'+
    '<blockquote class="charcard__q">“'+E(c.quote)+'”</blockquote>'+
    c.desc.map(function(p){return '<p class="charcard__d">'+p+'</p>';}).join("")+
   '</div></article>';
 }).join("")+'</div>'+
 '<div class="callout"><p><strong>More faces are coming.</strong> Elric the Scribe, Cara, Bren Valos, Valdris — the story\'s full cast will land here as their art is finished. Meet them in the meantime on the <a href="#story">Main Story</a> and <a href="#lore">Lore</a> pages.</p></div>';
}};

PAGES.diplomacy={t:"Clan Diplomacy",e:"The guide",d:"Clans that own regions charge outsiders to hunt there. Diplomacy lets two clans sign a treaty that trades discounted access for OIL — a deal that, once signed, cannot be broken.",h:function(){
 return '<h2 class="s">Why it exists</h2>'+
 '<p class="b">A clan that controls a region taxes everyone else who wants to <span class="cmd">!hunt</span> there: an <strong>entry toll</strong> to set foot in it and a <strong>hunt tax</strong> (up to 20%) on what you earn. <strong>Clan Diplomacy</strong> is the negotiating table on top of that — a clan can <strong>sell or gift access</strong> to its region: a reduction, or a full waiver, of that toll and tax, for an agreed number of days, in exchange for <strong>OIL</strong> from the other clan\'s treasury.</p>'+
 '<p class="b">Open it with <span class="cmd">!diplomacy</span>; see every standing treaty with <span class="cmd">!diplomacy_board</span>. Only a clan\'s <strong>leaders and sub-leaders</strong> can propose or sign.</p>'+
 '<h2 class="s">Three kinds of treaty</h2>'+
 tbl(["Direction","Who gets access"],[
  ['<strong>Grant</strong>',"You open <em>your</em> region to them — you are selling access to what you hold."],
  ['<strong>Request</strong>',"You ask for access to <em>their</em> region — you are buying your way in."],
  ['<strong>Mutual</strong>',"Both clans open their regions to each other on the same terms."]
 ],["k",""])+
 '<h2 class="s">The terms</h2>'+
 '<p class="b">Every treaty sets three things, and the discounts are stored as <strong>percentages, not frozen prices</strong> — if the region owner later raises their tax, your discount still applies to the new rate.</p>'+
 tbl(["Term","Range"],[
  ["Entry-toll discount","0–100% (100% = free entry)"],
  ["Hunt-tax discount","0–100% (100% = tax-free hunting)"],
  ["Duration","1–90 days"],
  ["Price","Paid up front in OIL from the buyer's treasury"]
 ],["k","n"])+
 '<div class="callout"><p>The other clan\'s treasury is <strong>private</strong>. You never see how much they hold, and if a signer cannot actually afford the deal, only they are told — you just see it fail.</p></div>'+
 '<h2 class="s">Negotiating</h2>'+
 '<p class="b">A proposal is an opening offer, not a final one. The other side can <strong>counter</strong>, and you can counter back — up to <strong>3 rounds</strong> of haggling before a deal has to be taken or left. An offer nobody answers <strong>expires on its own after 48 hours</strong>, and every active treaty warns both clans <strong>24 hours</strong> before it lapses.</p>'+
 '<h2 class="s">The one rule that changes everything</h2>'+
 '<div class="callout callout--warn"><p><strong>A signed treaty cannot be broken.</strong> It runs to term, full stop. There is no notice period, no buy-out, no betrayal — the <em>duration is the commitment</em>. That is what makes a treaty worth the OIL: the other clan cannot take your money and slam the gate a day later.</p></div>'+
 '<p class="b">The flip side is that signing <strong>ties you down</strong>. A clan that has granted access to its region <strong>cannot relocate</strong> to a different one while the treaty is live — you sold entry to that land, so you have to keep holding it. And a clan can carry at most <strong>5 active treaties</strong> at once, so you cannot simply ally with everyone.</p>'+
 '<h2 class="s">How to use it</h2>'+
 '<p class="b"><strong>If you own a rich hunting region</strong>, your access is a product. Sell short, expensive waivers to clans grinding materials and turn your territory into treasury income.</p>'+
 '<p class="b"><strong>If your clan is farming a region you do not hold</strong>, do the math: a 30-day tax waiver often costs less than the tax you would pay hunting it raw.</p>'+
 '<p class="b"><strong>Sign for a term you are sure of.</strong> You cannot undo it — a 90-day grant is 90 days you have committed that region, treaty and all.</p>'+
 '<h2 class="s">A second kind of pact</h2>'+
 '<p class="b">The same <span class="cmd">!diplomacy</span> panel signs one other deal type: a <strong>Defense Alliance</strong>. It trades no regional access — it is a mutual-defense pact, and it only matters when another clan comes to <a href="#sabotage">sabotage</a> your territory. When that happens your ally is summoned to the defense and can fight it at your side. See <a href="#sabotage">Clan Sabotage</a>.</p>';
}};

PAGES.sabotage={t:"Clan Sabotage",e:"The guide",d:"Covert clan-versus-clan raids that plant a temporary curse on a rival's region — no conquest, no ownership change, just a knife in the dark that the owner and their allies get one window to stop.",h:function(){
 return '<h2 class="s">Raids, not conquest</h2>'+
 '<p class="b"><strong>Clan Sabotage</strong> is how you hurt a rival clan without trying to take their land. A sabotage <strong>never changes who owns a region</strong> — it slips in, plants a <strong>temporary effect</strong>, and slips out. It is the aggressive counterpart to <a href="#diplomacy">Clan Diplomacy</a>: diplomacy buys your way into someone\'s region, sabotage forces it.</p>'+
 '<p class="b">Open the panel with <span class="cmd">!sabotage</span> — pick the target region, then the effect. See every raid currently in play with <span class="cmd">!sabotages</span>. <strong>Any clan member</strong> can call a Smuggle run; only <strong>leaders and sub-leaders</strong> can order the three damaging effects.</p>'+
 '<h2 class="s">The four effects</h2>'+
 '<p class="b">A raid carries exactly <strong>one</strong> effect, and the effect sets how many raiders you bring:</p>'+
 tbl(["Effect","Raiders","What it does"],[
  ['🚪 <strong>Smuggle</strong>',"1–3","Your raiding party hunts that region <strong>free of the entry toll</strong> for the rest of the day — you force your own way in without a treaty."],
  ['📉 <strong>Drop Sabotage</strong>',"3","<strong>−50% to the region\'s hunt drops</strong> for 12 hours. Everyone hunting there, owners included, gets half the loot."],
  ['🧬 <strong>Passive Sabotage</strong>',"3","<strong>−50% to the region\'s territory passive</strong> for 12 hours — you halve the combat bonus the owners get from holding the land."],
  ['💰 <strong>Treasury Raid</strong>',"4","Steal <strong>5% of the enemy clan\'s treasury</strong> straight into yours, instantly, on the win. A clan can only be robbed <strong>once every 12 hours</strong>."]
 ],["k","n",""])+
 '<h2 class="s">The defense window</h2>'+
 '<p class="b">Sabotage is not a sneak attack you cannot answer. The moment you launch, a <strong>defense window opens</strong> — its length is how long it takes your raiders to <em>travel</em> to the region (raid from next door and the window is short; raid from across Valestia and the defenders get real time to muster). A live countdown shows both sides exactly when the fighting starts.</p>'+
 '<p class="b">The defending clan — <strong>and any clan it holds a Defense Alliance with</strong> — gets a lobby to put bodies on the wall. Whatever slots the defenders leave empty are <strong>filled by the region\'s garrison NPCs</strong>. Then a public thread opens in the region and the two sides fight it out as a <strong>team battle in the normal combat engine</strong>, with the garrison playing to win — no passive defending.</p>'+
 '<h2 class="s">The garrison</h2>'+
 '<p class="b">A region\'s <strong>garrison</strong> is a clan upgrade, bought from the region\'s own upgrade panel and levelled from <strong>0 to 10</strong>. It is your standing defense for when your members are offline — the higher the level, the harder the NPCs that fill your empty defense slots:</p>'+
 tbl(["Garrison level","What the defenders get"],[
  ["0–3","Baseline NPC defenders, scaled to the raiders\' level."],
  ["4+","The garrison NPCs start carrying combat <strong>passives</strong>."],
  ["8+","An <strong>extra</strong> defender joins the line (up to four)."],
  ["9","That extra body becomes a <strong>Captain</strong> — a tougher, boss-tier NPC."],
  ["10","The Captain is replaced by a <strong>doppelgänger of a clan member you designate</strong> — a frozen snapshot that fights with their real gear and their weapon\'s Active Skill."]
 ],["k",""])+
 '<div class="callout"><p>The Lv.10 doppelgänger is the point of the whole track: a copy of your best-geared member standing guard around the clock, swinging their actual weapon and spending its Active exactly as they would.</p></div>'+
 '<h2 class="s">Win, lose, and cooldowns</h2>'+
 '<p class="b"><strong>Raiders win</strong> → the effect lands: the debuff is planted, the smuggling waiver is granted, or the OIL is moved. <strong>Raiders lose</strong> → they come away <strong>wounded</strong>, locked out of starting or joining <em>any</em> sabotage for the rest of the day, and the defenders are paid a <strong>bounty</strong> for holding the line. A failed <strong>Smuggle</strong> is worse still: the whole party is <strong>barred from entering that region</strong> for the day — you were caught at the gate.</p>'+
 '<p class="b">You cannot grind a single rival into the ground, either. The damaging effects sit on a <strong>cooldown against a given clan</strong>, and smuggling a given region is capped at <strong>once a day per raider</strong>. Sabotage is a scalpel, not a siege — for the fights that actually take and hold ground, see the <a href="#modes">large-scale modes</a>.</p>';
}};

PAGES.gyms={t:"Pokemax Gyms",e:"Pokemax",d:"Ten gyms, one per region, each with a medal to win — and each one a seat a player can take, hold, and lose. The endgame territory layer for Pokemax.",h:function(){
 var G=[
  ["Starter Ruins","🏺 Relic Medal","Curator Aster"],
  ["Black Lotus Wood","🪷 Black Lotus Medal","Warden Ilyra"],
  ["Stormbay Docks","🌊 Tide Medal","Captain Maren"],
  ["Rocky Chill Pass","❄️ Summit Medal","Summit Keeper Orik"],
  ["Ravencraft","🐦‍⬛ Raven Medal","Ravenmaster Veyr"],
  ["The Mist Forest","🌫️ Mist Medal","Seer Nyx"],
  ["Crimson Plain","🔥 Ember Medal","Ash Champion Kael"],
  ["Merchant Crossroads","⚖️ Caravan Medal","Marshal Tessa"],
  ["Bandit Caves","💀 Outlaw Medal","Grotto King Brakk"],
  ["Dark Knight's Sanctum","🔮 Abyss Medal","Abyssal Knight Morcant"]
 ];
 return '<h2 class="s">Ten gyms, ten medals</h2>'+
 '<p class="b">Every huntable region has a <strong>Gym</strong> — a 3-versus-3 Pokemax battle with a <strong>medal</strong> on the line. But a Gym is more than a badge to collect: it is a <strong>seat</strong>. When no player holds it, a named <strong>NPC leader</strong> defends it. Beat them and <strong>you become the leader</strong> — until someone stronger comes to take it from you.</p>'+
 tbl(["Region","Medal","Default NPC leader"],G.map(function(g){return [g[0],g[1],g[2]];}),["k","k",""])+
 '<p class="b">List them all with <span class="cmd">!gyms</span>, inspect one with <span class="cmd">!gym</span>. The NPC defenders field teams at level <strong>42 / 45 / 48</strong> — this is <strong>endgame</strong> content, meant for a Pokemax stable you have already built up.</p>'+

 '<h2 class="s">Conquering a Gym</h2>'+
 '<p class="b">Challenge the current holder — NPC or player — with <span class="cmd">!gym_challenge</span>. Win, and you take the seat: you become the region\'s Gym Leader and the <strong>medal is yours</strong>. You get <strong>3 attacks per day</strong> across all Gyms, so choosing which door to knock on matters.</p>'+
 '<div class="callout"><p>Taking a Gym off another <strong>player</strong> is the real prize. NPC leaders are a wall to climb; player-held Gyms are a standing you took from someone who now wants it back.</p></div>'+

 '<h2 class="s">Holding it — defence and rent</h2>'+
 '<p class="b">As leader you set the team that defends for you with <span class="cmd">!gym_team</span> (changeable once every <strong>24 hours</strong>, so pick a real wall, not a whim). While you hold a region\'s Gym, you earn <strong>rent</strong> — a passive cut tied to the Safari activity happening in your region. A held Gym is an income stream, not a trophy on a shelf.</p>'+
 '<div class="callout callout--warn"><p><strong>You have to show up.</strong> A leader who goes quiet for <strong>14 days</strong> is treated as inactive and loses the Gym. The seat belongs to whoever is still playing for it.</p></div>'+

 '<h2 class="s">The windows that keep it fair</h2>'+
 '<p class="b">Conquest is not a revolving door. A set of timers stops a Gym from being farmed back and forth in one sitting:</p>'+
 tbl(["Window","What it does"],[
  ["Conquest protection · 12h","A freshly taken Gym cannot be attacked again for 12 hours — you get to actually hold it."],
  ["Failed-attack protection · 4h","Lose a challenge and that Gym is off-limits to you for 4 hours. No spam."],
  ["Revenge · 48h","Lost your Gym? You have a 48-hour window to challenge back and take it from the one who took it."],
  ["Team change · 24h","A leader can only reshape their defending team once a day."]
 ],["k",""])+
 '<div class="callout"><p><strong>The rhythm this creates:</strong> take a Gym, hold it protected for half a day, defend it against challengers, and keep an eye on the clock when yours falls — the revenge window is short, and after it closes the medal is well and truly theirs.</p></div>'+

 '<h2 class="s">How to think about it</h2>'+
 '<p class="b"><strong>Build the stable first.</strong> NPC leaders sit at 42–48; do not knock until your best Pokemax can trade with that.</p>'+
 '<p class="b"><strong>Defend with a wall, attack with coverage.</strong> Your <a href="#genes">gene</a> keepers earn their genes here — a defending team that dodges the common attackers holds a Gym for days.</p>'+
 '<p class="b"><strong>Hold the region you Safari.</strong> Rent follows Safari activity, so the Gym in your home region pays you the most.</p>';
}};

PAGES.mysteries={t:"Mysteries",e:"The world",d:"Valestia keeps secrets. Some of them are waiting for a player who does the right thing in the right place — and no two are alike.",h:function(){
 return '<h2 class="s">There are secrets in here</h2>'+
 '<p class="b">Scattered across Valestia and the systems that run on top of it are <strong>hidden mysteries</strong> — things the game never tells you are there. Nobody hands you a quest for them. They are <strong>found</strong>, by playing: by going somewhere, trying something, noticing a detail, doing the unexpected.</p>'+
 '<p class="b">Each one is <strong>one of a kind</strong>, and each pays off in its own way — a reward, a reveal, a surprise that exists nowhere else in the game. Some are small. Some are not.</p>'+
 '<h2 class="s">Your journal</h2>'+
 '<p class="b"><span class="cmd">!mystery</span> (also <span class="cmd">!mistery</span>) opens your <strong>mystery journal</strong>: what you have uncovered so far, and the unique things it earned you. It fills in as you find them.</p>'+
 '<div class="callout"><p><strong>No list here — on purpose.</strong> Half the point of a secret is not knowing it was there until you trip over it. This page will not tell you what to look for or where. Play, stay curious, and let Valestia surprise you.</p></div>'+
 '<p class="b">If you find one, you will know. That is rather the idea.</p>';
}};

PAGES.valestia={t:"Valestia",e:"The world",d:"Ten huntable regions, the roads between them, and the places the story happens. Select any marker on the map.",h:function(){
 return '<div class="atlas"><div class="atlas__m" id="map"></div>'+
 '<aside class="atlas__s"><div class="dos" id="dos"></div></aside></div>'+
 '<div class="leg">'+
 '<span><b style="background:var(--verdigris)"></b>Huntable region</span>'+
 '<span><b style="background:transparent;border:2px solid var(--verdigris)"></b>Story location</span>'+
 '<span><b style="background:transparent;border:2px dashed var(--corrupt)"></b>Seal site</span>'+
 '<span><b style="background:var(--brass)"></b>Selected</span>'+
 '</div>'+
 '<h2 class="s">Travel and hunt</h2>'+
 '<p class="b"><span class="cmd">!travel</span> moves you between regions. <span class="cmd">!hunt</span> farms the region you are standing in for <strong>Oil, XP and that region\'s signature material</strong>. Each region has its own roster and its own drop table.</p>'+
 '<p class="b">There are <strong>210 named enemies</strong> across ten regions — 3 species × 7 tiers each. Their stats are <strong>generated from level</strong>, so a hunted enemy always matches you; the tier name is just flavour for the band you are in. Max may cap hunts per day.</p>'+
 '<div class="callout"><p>Hunting the right region is how you farm the exact material your next piece needs, instead of grinding random modes and hoping. Every weapon recipe needs a signature material.</p></div>'+
 '<h2 class="s">Signature materials</h2>'+
 tbl(["Region","Signature material"],Object.keys(PLACES).filter(function(k){return PLACES[k].m;}).map(function(k){return [PLACES[k].n,PLACES[k].m];}),["k","n"])+
 '<h2 class="s">Region upgrades and taxes</h2>'+
 '<p class="b">Regions can be <strong>upgraded</strong> for bonuses and may charge entry <strong>taxes</strong>. Both are set by Max on the server the bot lives in.</p>'+
 '<h2 class="s">Large-scale war</h2>'+
 '<p class="b">Three systems sit on top of the map, and they all feed each other.</p>'+
 '<h3 class="t">Corruption and liberation battles</h3>'+
 '<p class="b">A region can fall <strong>Corrupted</strong>, and it is the closest thing the world has to losing ground. When it happens:</p>'+
 '<div class="tw"><table><tbody>'+
 '<tr><td class="k">Drops</td><td>Turn off completely. No materials, no signature material, nothing.</td></tr>'+
 '<tr><td class="k">Enemies</td><td>Gain a <strong>Corrupted</strong> tag and a hard stat increase — roughly +35% and +30% on their numbers.</td></tr>'+
 '<tr><td class="k">Upgrades</td><td>Freeze. Whatever the region had built up stops progressing.</td></tr>'+
 '</tbody></table></div>'+
 '<p class="b">The only way back is a <strong>liberation battle</strong> — a staged <strong>Vanguard PvE</strong> campaign fought in sequence with <span class="cmd">!liberate</span>. You do not win it in one fight: you clear the stages, and winning the last one lifts the corruption, turns the drops back on and unfreezes everything the region had.</p>'+
 '<div class="callout callout--warn"><p>A corrupted region is dead economy. If the one you farm goes dark, the signature material you need goes with it — and no other region drops it. Liberating it is not optional content, it is how you get your supply line back.</p></div>'+
 '<h3 class="t">Castle Siege</h3>'+
 '<p class="b">An 8-zone, 3-lane castle fought in phases — announced, preparation, combat window, result. Hold zones to keep enemies away from the Throne Room, with <strong>Intercept, Supply, Rescue</strong> and <strong>Sabotage</strong> objectives. Pays War Oil and XP.</p>'+
 '<div class="callout"><p><strong>Hold the Main Gate.</strong> It feeds the centre and connects all three lanes. Everything else is negotiable.</p></div>'+
 '<h3 class="t">War</h3>'+
 '<p class="b">Multi-team control of 5 sectors: North, Center (the most contested), South, Vanguard and Rearguard. Winning a sector pays Oil, War Oil, XP and materials — and buys you an edge in the next one, so the sectors are not independent.</p>'+
 '<h3 class="t">Territory</h3>'+
 '<p class="b">The persistent layer underneath all of it. Clans and players <strong>hold</strong> zones and get passive combat bonuses inside them — extra parry, dodge, mitigation, post-crit damage. It does not reset between events; it is simply who owns what right now.</p>';
}};

PAGES.lore={t:"Lore",e:"The world",d:"What the scroll says, what is under Aldenmoor, and what is happening to the water in Stormbay harbour.",h:function(){
 return '<h2 class="s">Azroth</h2>'+
 '<p class="b">A malign being, sealed. The seal is <strong>failing</strong>. The three locations named in the scroll all connect to the original seal, and the seal needs <strong>three pieces</strong> to be repaired — one in each place.</p>'+
 '<h2 class="s">The Scroll</h2>'+
 '<p class="b">Written in a dead script and co-authored by <strong>Gorim</strong> and the <strong>Varn family</strong>. It describes the road to three places: <strong>Aldenmoor</strong> (ruins, north-west), <strong>Veldran</strong> (a city in the mountains) and <strong>Mirefall</strong> (a swamp). Elric spent thirty years on the script before he ever met you.</p>'+
 '<h2 class="s">The Seal and the Varns</h2>'+
 '<p class="b">The Varns <strong>built the mechanism</strong>. Maren Varn — the last of them, hidden for thirty years — had the key, and gave it to you. The old maps of the tunnels have <strong>intentional errors</strong>: the original builders did not trust outsiders.</p>'+
 '<h2 class="s">The dark circle</h2>'+
 '<div class="ex"><p class="ex__h">What the Harbor Knows</p>'+
 '<p>Thirty feet across. The water inside it is completely still. Absolutely nobody on the docks looks at it.</p></div>'+
 '<p class="b">It appeared in Stormbay harbour, and then again at the cove where the Grey Maren made landfall. It is Azroth, leaking through.</p>'+
 '<h2 class="s">The Hollow</h2>'+
 '<p class="b">Creatures born from Azroth\'s seepage into Aldenmoor. Distorted humanoid shapes with <strong>no eyes</strong>, that dissolve into smoke when they die. They come up from the old underground entrances. They were the first thing in this story that was not human.</p>'+
 '<h2 class="s">The Archive</h2>'+
 '<p class="b">Below Aldenmoor there is something older than Aldenmoor. The refugees dug a granary foundation and found a shaft; three workers went down and one came back wrong.</p>'+
 '<div class="grid grid--wide">'+CODEX.map(function(c){
  return '<div class="card"><div class="card__h"><span class="card__n">'+E(c[0])+'</span><span class="card__tag">'+E(c[1])+'</span></div>'+
   '<div class="card__st">'+E(c[2])+'</div><div class="card__d">'+E(c[3])+"</div></div>";
 }).join("")+"</div>"+
 '<h2 class="s">The cast</h2>'+
 '<div class="grid grid--wide">'+[
  ["The Guardian","You","Chosen by prophecy — Gorim\'s word, not yours. You carry the scroll and Maren\'s key."],
