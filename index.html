<link rel="stylesheet" href="fonts.css">
<style>
*,*::before,*::after{box-sizing:border-box}
html{-moz-text-size-adjust:none;-webkit-text-size-adjust:none;text-size-adjust:none}
body,h1,h2,h3,h4,p,figure,blockquote,dl,dd{margin:0}
ul[role='list'],ol[role='list']{list-style:none}
img,picture,svg,video,canvas{max-width:100%;display:block}
input,button,textarea,select{font:inherit}
table{border-collapse:collapse}

:root{
  --bg:#D5D8D1; --bg-raised:#DEE0DA; --bg-sunken:#C7CBC3; --bg-rail:#CDD1C9;
  --rule:rgba(20,45,40,.18); --rule-strong:rgba(20,45,40,.38);
  --graticule:rgba(47,97,83,.09);
  --text:#16211F; --text-dim:#455249; --text-faint:#6B7A73;
  --brass:#8A6522; --brass-soft:rgba(138,101,34,.13);
  --verdigris:#2F6153; --verdigris-soft:rgba(47,97,83,.10);
  --corrupt:#8C3A32; --corrupt-soft:rgba(140,58,50,.11);
  --sea:#9DAAA6; --sea-deep:#7C8C88; --land:#CFD3CB; --void:#0A1416;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --cond:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --rail:266px;
  --ease:cubic-bezier(.2,.7,.3,1);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0A1416; --bg-raised:#111E20; --bg-sunken:#060D0E; --bg-rail:#0C181A;
    --rule:rgba(160,195,186,.15); --rule-strong:rgba(160,195,186,.32);
    --graticule:rgba(120,185,168,.06);
    --text:#DCE3DF; --text-dim:#93A49E; --text-faint:#65766F;
    --brass:#C79A4B; --brass-soft:rgba(199,154,75,.14);
    --verdigris:#4E9584; --verdigris-soft:rgba(78,149,132,.12);
    --corrupt:#B4544A; --corrupt-soft:rgba(180,84,74,.14);
    --sea:#12262A; --sea-deep:#0B191C; --land:#16282A; --void:#04090A;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1416; --bg-raised:#111E20; --bg-sunken:#060D0E; --bg-rail:#0C181A;
  --rule:rgba(160,195,186,.15); --rule-strong:rgba(160,195,186,.32);
  --graticule:rgba(120,185,168,.06);
  --text:#DCE3DF; --text-dim:#93A49E; --text-faint:#65766F;
  --brass:#C79A4B; --brass-soft:rgba(199,154,75,.14);
  --verdigris:#4E9584; --verdigris-soft:rgba(78,149,132,.12);
  --corrupt:#B4544A; --corrupt-soft:rgba(180,84,74,.14);
  --sea:#12262A; --sea-deep:#0B191C; --land:#16282A; --void:#04090A;
}
:root[data-theme="light"]{
  --bg:#D5D8D1; --bg-raised:#DEE0DA; --bg-sunken:#C7CBC3; --bg-rail:#CDD1C9;
  --rule:rgba(20,45,40,.18); --rule-strong:rgba(20,45,40,.38);
  --graticule:rgba(47,97,83,.09);
  --text:#16211F; --text-dim:#455249; --text-faint:#6B7A73;
  --brass:#8A6522; --brass-soft:rgba(138,101,34,.13);
  --verdigris:#2F6153; --verdigris-soft:rgba(47,97,83,.10);
  --corrupt:#8C3A32; --corrupt-soft:rgba(140,58,50,.11);
  --sea:#9DAAA6; --sea-deep:#7C8C88; --land:#CFD3CB; --void:#0A1416;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--cond);font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(var(--graticule) 1px,transparent 1px),linear-gradient(90deg,var(--graticule) 1px,transparent 1px);
  background-size:64px 64px,64px 64px;
}
::selection{background:var(--brass);color:var(--bg)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
h1,h2,h3,h4,p,ul,ol{margin:0}

/* ── SHELL ── */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}
@media (max-width:940px){.app{grid-template-columns:1fr}}

.rail{
  background:var(--bg-rail);border-right:1px solid var(--rule);
  position:sticky;top:0;height:100vh;overflow-y:auto;padding:1.3rem 0 3rem;
}
@media (max-width:940px){
  .rail{position:fixed;inset:0 auto 0 0;width:min(84vw,300px);z-index:60;transform:translateX(-101%);transition:transform .26s var(--ease);border-right:1px solid var(--rule-strong)}
  .rail.is-open{transform:none}
}
.brand{display:block;padding:0 1.3rem 1.1rem;border-bottom:1px solid var(--rule);text-decoration:none}
.brand__w{font-family:var(--serif);font-weight:700;font-size:1.32rem;letter-spacing:-.01em;color:var(--text);line-height:1}
.brand__w em{font-style:italic;font-weight:400;color:var(--brass)}
.brand__s{font-family:var(--cond);font-weight:600;font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:var(--text-faint);margin-top:.4rem;display:block}
.langsw{display:flex;gap:.35rem;margin:0 1.3rem 1rem;padding-bottom:1.05rem;border-bottom:1px solid var(--rule)}
.langsw__b{flex:1;font-family:var(--cond);font-weight:700;font-size:.7rem;letter-spacing:.12em;color:var(--text-faint);background:transparent;border:1px solid var(--rule);border-radius:6px;padding:.34rem 0;cursor:pointer;transition:color .15s,background .15s,border-color .15s}
.langsw__b:hover{color:var(--text);border-color:var(--rule-strong)}
.langsw__b.on{color:#231800;background:var(--brass);border-color:var(--brass)}

.navgrp{padding:1.15rem 0 .2rem}
.navgrp__t{font-family:var(--cond);font-weight:600;font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:var(--verdigris);padding:0 1.3rem .5rem}
.nav{display:flex;flex-direction:column}
.nav a{
  font-family:var(--cond);font-size:.95rem;color:var(--text-dim);text-decoration:none;
  padding:.34rem 1.3rem;border-left:2px solid transparent;transition:all .14s var(--ease);
  display:flex;align-items:baseline;gap:.5rem;
}
.nav a:hover{color:var(--text);background:var(--brass-soft)}
.nav a.is-on{color:var(--brass);border-left-color:var(--brass);background:var(--brass-soft)}
.nav a i{font-family:var(--mono);font-size:.6rem;font-style:normal;color:var(--text-faint);margin-left:auto}
.nav a.is-on i{color:var(--brass)}

.scrim{display:none}
@media (max-width:940px){
  .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55;opacity:0;pointer-events:none;transition:opacity .26s var(--ease)}
  .scrim.is-on{opacity:1;pointer-events:auto}
}
.burger{
  display:none;position:fixed;top:.7rem;left:.7rem;z-index:70;
  background:var(--bg-raised);border:1px solid var(--rule-strong);color:var(--text);
  font-family:var(--cond);font-weight:600;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;
  padding:.5rem .8rem;cursor:pointer;
}
@media (max-width:940px){.burger{display:block}}

/* ── MAIN ── */
.main{min-width:0}
.page{display:none;padding:clamp(2rem,4vw,3.6rem) clamp(1.1rem,3.4vw,3.4rem) 6rem;max-width:1180px}
.page.is-on{display:block}
@media (max-width:940px){.page{padding-top:3.6rem}}

.ph{border-bottom:1px solid var(--rule);padding-bottom:1.5rem;margin-bottom:2.2rem}
.ph__e{font-family:var(--cond);font-weight:600;font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:var(--verdigris)}
.ph h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,3.6vw,2.9rem);line-height:1.04;letter-spacing:-.02em;margin:.5rem 0 0;text-wrap:balance}
.ph__d{font-family:var(--serif);font-size:1.04rem;color:var(--text-dim);margin-top:.85rem;max-width:64ch;line-height:1.6}

h2.s{font-family:var(--serif);font-weight:600;font-size:1.5rem;margin:2.8rem 0 .3rem;letter-spacing:-.01em;scroll-margin-top:1rem}
h2.s:first-of-type{margin-top:0}
h3.t{font-family:var(--cond);font-weight:600;font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;color:var(--brass);margin:2rem 0 .8rem}
p.b{font-family:var(--serif);font-size:1.02rem;line-height:1.62;color:var(--text-dim);max-width:64ch;margin:.75rem 0}
p.b strong{color:var(--text);font-weight:600}
p.b em{font-style:italic}
.cmd{font-family:var(--mono);font-size:.84em;color:var(--brass);background:var(--brass-soft);padding:.08em .36em;white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.fx{font-family:var(--mono);font-size:.78rem;color:var(--verdigris);background:var(--verdigris-soft);padding:.6rem .75rem;margin:.85rem 0;display:block;overflow-x:auto;white-space:nowrap;max-width:64ch}

.callout{border-left:2px solid var(--brass);background:var(--brass-soft);padding:.85rem 1rem;margin:1.2rem 0;max-width:66ch}
.callout p{font-family:var(--serif);font-size:.96rem;line-height:1.55;color:var(--text-dim);margin:0}
.callout p+p{margin-top:.5rem}
.callout--warn{border-left-color:var(--corrupt);background:var(--corrupt-soft)}

/* ── TABLE ── */
.tw{overflow-x:auto;border:1px solid var(--rule);margin:1rem 0}
table{border-collapse:collapse;width:100%;min-width:440px}
th{
  font-family:var(--cond);font-weight:600;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--text-faint);text-align:left;padding:.6rem .8rem;background:var(--bg-raised);
  border-bottom:1px solid var(--rule-strong);white-space:nowrap;
}
td{
  font-family:var(--cond);font-size:.92rem;color:var(--text-dim);padding:.52rem .8rem;
  border-bottom:1px solid var(--rule);vertical-align:top;
}
tr:last-child td{border-bottom:0}
td.k{font-family:var(--serif);font-weight:600;color:var(--text);white-space:nowrap}
td.n{font-family:var(--mono);font-size:.82rem;font-variant-numeric:tabular-nums;color:var(--brass);white-space:nowrap}
td.m{font-family:var(--mono);font-size:.76rem;color:var(--text-faint)}
tbody tr:hover td{background:var(--brass-soft)}

/* ── CARD GRID ── */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin:1rem 0}
.grid--wide{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.card{background:var(--bg);padding:1.15rem 1.1rem}
.card__h{display:flex;align-items:baseline;gap:.5rem;margin-bottom:.45rem}
.card__n{font-family:var(--serif);font-weight:600;font-size:1.04rem;color:var(--text)}
.card__tag{font-family:var(--mono);font-size:.6rem;letter-spacing:.06em;color:var(--brass);border:1px solid var(--brass);padding:.05rem .3rem;margin-left:auto;white-space:nowrap}
.card__tag--clan{color:var(--corrupt);border-color:var(--corrupt)}
.card__st{font-family:var(--mono);font-size:.72rem;color:var(--verdigris);margin-bottom:.4rem}
.card__d{font-family:var(--cond);font-size:.9rem;color:var(--text-dim);line-height:1.5}
.card__f{font-family:var(--mono);font-size:.66rem;color:var(--text-faint);margin-top:.55rem;padding-top:.5rem;border-top:1px solid var(--rule)}

/* ── CALCULATOR ── */
.rig{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);margin:1.2rem 0}
@media (max-width:820px){.rig{grid-template-columns:1fr}}
.rig__p{background:var(--bg-raised);padding:1.4rem 1.2rem}
.rig__o{background:var(--bg);padding:1.4rem 1.2rem}
.lvl{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-bottom:1rem;border-bottom:1px solid var(--rule)}
.lvl__l{font-family:var(--cond);font-weight:600;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--text-faint)}
.lvl__c{display:flex;align-items:center;gap:.45rem}
.btn{font-family:var(--mono);font-size:.88rem;line-height:1;background:transparent;color:var(--text);border:1px solid var(--rule-strong);width:25px;height:25px;cursor:pointer;display:grid;place-items:center;padding:0;transition:all .14s var(--ease)}
.btn:hover:not(:disabled){border-color:var(--brass);color:var(--brass)}
.btn:disabled{opacity:.25;cursor:not-allowed}
.lvl__v{font-family:var(--mono);font-size:1rem;color:var(--brass);min-width:2.2ch;text-align:center;font-variant-numeric:tabular-nums}
.bud{display:flex;justify-content:space-between;align-items:baseline;padding:.9rem 0 .2rem}
.bud__t{font-family:var(--cond);font-weight:600;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--text-faint)}
.bud__v{font-family:var(--mono);font-size:.84rem;font-variant-numeric:tabular-nums}
.bud__v.over{color:var(--corrupt)}
.st{padding:.85rem 0;border-top:1px solid var(--rule)}
.st__t{display:flex;align-items:center;gap:.6rem;margin-bottom:.45rem}
.st__k{font-family:var(--cond);font-weight:600;font-size:.9rem;letter-spacing:.14em;text-transform:uppercase;width:3.4ch}
.st__d{font-family:var(--cond);font-size:.8rem;color:var(--text-faint);margin-right:auto;line-height:1.25}
.st__v{font-family:var(--mono);font-size:.95rem;color:var(--brass);min-width:2.4ch;text-align:right;font-variant-numeric:tabular-nums}
.st__r{display:flex;align-items:center;gap:.5rem}
.mtr{flex:1;height:5px;background:var(--bg-sunken);border:1px solid var(--rule);position:relative;overflow:hidden}
.mtr__f{position:absolute;inset:0 auto 0 0;background:var(--brass);transition:width .2s var(--ease)}
.ro{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin-bottom:1.2rem}
.tl{background:var(--bg-raised);padding:.75rem .8rem;display:flex;flex-direction:column;gap:.22rem}
.tl__k{font-family:var(--cond);font-weight:600;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint)}
.tl__v{font-family:var(--mono);font-size:1.2rem;color:var(--text);font-variant-numeric:tabular-nums;line-height:1.1}
.tl__v.br{color:var(--brass)}
.tl__f{font-family:var(--mono);font-size:.6rem;color:var(--text-faint)}
.dm{border:1px solid var(--rule);margin-bottom:1.1rem}
.dm__h{font-family:var(--cond);font-weight:600;font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--text-faint);padding:.6rem .8rem;border-bottom:1px solid var(--rule);background:var(--bg-raised)}
.dm__r{display:flex;align-items:center;gap:.8rem;padding:.55rem .8rem;border-bottom:1px solid var(--rule)}
.dm__r:last-child{border-bottom:0}
.dm__l{font-family:var(--cond);font-size:.86rem;color:var(--text-dim);width:10ch;flex-shrink:0}
.dm__b{flex:1;height:13px;background:var(--bg-sunken);border:1px solid var(--rule);position:relative;overflow:hidden;min-width:34px}
.dm__s{position:absolute;top:0;bottom:0;transition:all .2s var(--ease)}
.dm__n{font-family:var(--mono);font-size:.8rem;width:9ch;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.vd{font-family:var(--serif);font-size:.92rem;color:var(--text-faint);line-height:1.5;border-left:2px solid var(--verdigris);padding-left:.75rem}

/* ── MAP ── */
.atlas{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,290px);gap:1px;background:var(--rule);border:1px solid var(--rule);margin:1.2rem 0}
@media (max-width:940px){.atlas{grid-template-columns:1fr}}
.atlas__m{background:var(--sea-deep);position:relative;overflow:hidden}
.mapwrap{position:relative;line-height:0}
.mapimg{width:100%;height:auto;display:block}
/* markers sit over the painted map in % so they track it at any width */
.pin{
  position:absolute;transform:translate(-50%,-50%);background:none;border:0;padding:10px;
  cursor:pointer;line-height:0;z-index:2;
}
.pin__d{
  display:block;width:11px;height:11px;border-radius:50%;
  background:transparent;border:2px solid var(--verdigris);
  box-shadow:0 0 0 2px rgba(0,0,0,.45);transition:all .16s var(--ease);
}
.pin.hunt .pin__d{background:var(--verdigris)}
.pin.seal .pin__d{border-style:dashed;border-color:var(--corrupt)}
.pin:hover .pin__d{border-color:var(--brass);background:var(--brass);transform:scale(1.35)}
.pin.on .pin__d{background:var(--brass);border-color:var(--brass);transform:scale(1.5);box-shadow:0 0 0 3px rgba(0,0,0,.5),0 0 14px 3px var(--brass)}
.pin__t{
  position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);
  font-family:var(--cond);font-weight:600;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;
  white-space:nowrap;color:#F2EDE2;background:rgba(6,14,15,.92);border:1px solid var(--brass);
  padding:.16rem .4rem;line-height:1.3;opacity:0;pointer-events:none;transition:opacity .16s var(--ease);
}
.pin:hover .pin__t,.pin:focus-visible .pin__t,.pin.on .pin__t{opacity:1}
.atlas__s{background:var(--bg-raised);padding:1.3rem 1.2rem}
.leg{display:flex;flex-wrap:wrap;gap:1rem;padding:.7rem .9rem;border-top:1px solid var(--rule);background:var(--bg-raised)}
.leg span{font-family:var(--cond);font-size:.74rem;color:var(--text-faint);display:flex;align-items:center;gap:.35rem}
.leg b{width:8px;height:8px;border-radius:50%;display:inline-block}
.dos__e{font-family:var(--mono);font-size:.64rem;color:var(--brass)}
.dos h3{font-family:var(--serif);font-weight:600;font-size:1.3rem;margin:.2rem 0 0;line-height:1.15}
.dos__r{border-top:1px solid var(--rule);padding-top:.65rem;margin-top:.85rem}
.dos__k{font-family:var(--cond);font-weight:600;font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint);margin-bottom:.3rem}
.dos__m{font-family:var(--mono);font-size:.82rem;color:var(--brass)}
.dos__x{font-family:var(--cond);font-size:.88rem;color:var(--text-dim);line-height:1.45}
.sp{margin-bottom:.45rem;font-family:var(--cond);font-size:.86rem;line-height:1.35}
.sp__a{font-family:var(--mono);font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;color:var(--verdigris);display:block}
.sp__n{color:var(--text-dim)}
.sp__n b{color:var(--text);font-weight:400}

/* ── DISCORD EMBED MOCKUPS ── always dark, the way Discord actually renders ── */
.dsc{
  background:#2b2d31;border-left:4px solid var(--dsc-accent,#c79a4b);border-radius:4px;
  padding:.85rem 1rem 1rem;margin:.9rem 0;max-width:520px;
  font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:#dbdee1;line-height:1.4;box-shadow:0 1px 3px rgba(0,0,0,.35);
  overflow-x:auto;
}
.dsc__t{color:#f2f3f5;font-weight:700;font-size:1rem;margin:0 0 .55rem;line-height:1.3}
.dsc__hd{color:#f2f3f5;font-weight:700;font-size:.9rem;margin:.7rem 0 .25rem}
.dsc__hd:first-child{margin-top:0}
.dsc__row{font-size:.86rem;margin:.32rem 0}

}

/* ── PET LAB ── */
.lab{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);margin:1.2rem 0}
@media (max-width:820px){.lab{grid-template-columns:1fr}}
.lab__ctl{background:var(--bg-raised);padding:1.3rem 1.2rem;display:flex;flex-direction:column;gap:1rem}

.lab__b{font-family:var(--cond);font-weight:600;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;background:transparent;color:var(--text-dim);border:1px solid var(--rule-strong);padding:.36rem .6rem;cursor:pointer;transition:all .14s var(--ease)}

.lab__q{font-family:var(--serif);font-size:.88rem;color:var(--text-faint);line-height:1.5;border-left:2px solid var(--verdigris);padding-left:.7rem;margin:0}
.lab__id{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;padding-bottom:1rem;border-bottom:1px solid var(--rule);margin-bottom:1.1rem}
.lab__emo{font-size:2.4rem;line-height:1}
.lab__nm{font-family:var(--serif);font-weight:600;font-size:1.5rem;line-height:1.1}
.lab__meta{font-family:var(--mono);font-size:.66rem;color:var(--text-faint);margin-top:.2rem}
.lab__badges{display:flex;gap:.35rem;margin-left:auto;flex-wrap:wrap}
.lab__bd{font-family:var(--mono);font-size:.6rem;letter-spacing:.06em;border:1px solid var(--verdigris);color:var(--verdigris);padding:.1rem .34rem;white-space:nowrap}
.lab__bd--t{border-color:var(--brass);color:var(--brass)}
.lab__desc{font-family:var(--serif);font-size:.94rem;color:var(--text-dim);line-height:1.55;margin:.9rem 0 0;font-style:italic}
.sb{padding:.5rem 0}
.sb__t{display:flex;align-items:baseline;gap:.5rem;margin-bottom:.28rem}
.sb__k{font-family:var(--cond);font-weight:600;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint);width:4.5ch}
.sb__v{font-family:var(--mono);font-size:1.02rem;color:var(--text);font-variant-numeric:tabular-nums}
.sb__d{font-family:var(--mono);font-size:.66rem;color:var(--brass);margin-left:auto}
.sb__bar{height:9px;background:var(--bg-sunken);border:1px solid var(--rule);position:relative;overflow:hidden}
.sb__ghost{position:absolute;inset:0 auto 0 0;background:var(--rule-strong);transition:width .2s var(--ease)}
.sb__fill{position:absolute;inset:0 auto 0 0;background:var(--brass);transition:width .2s var(--ease)}
.lab__chain{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-top:1.2rem;padding-top:1rem;border-top:1px solid var(--rule)}
.ev{display:flex;align-items:center;gap:.4rem;font-family:var(--cond);font-size:.86rem;color:var(--text-faint);border:1px solid var(--rule);padding:.28rem .5rem}
.ev.on{border-color:var(--brass);color:var(--brass);background:var(--brass-soft)}
.ev b{font-family:var(--mono);font-size:.6rem;font-weight:400;opacity:.75}
.ev__ar{font-family:var(--mono);font-size:.7rem;color:var(--text-faint)}
.lab__moves{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
.mv{background:var(--bg-raised);padding:.7rem .75rem}
.mv__h{display:flex;align-items:baseline;gap:.4rem}
.mv__n{font-family:var(--serif);font-weight:600;font-size:.94rem;color:var(--text)}
.mv__t{font-family:var(--mono);font-size:.58rem;letter-spacing:.06em;margin-left:auto;color:var(--verdigris);text-transform:uppercase}
.mv__s{font-family:var(--mono);font-size:.66rem;color:var(--text-faint);margin-top:.28rem}
.mv__e{font-family:var(--cond);font-size:.8rem;color:var(--text-dim);margin-top:.2rem;line-height:1.35}
.mv--stab{background:var(--brass-soft)}
.lab__learn{display:flex;flex-direction:column;gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.lrn{display:flex;flex-wrap:wrap;align-items:baseline;gap:.25rem .55rem;background:var(--bg-raised);padding:.45rem .65rem}
.lrn--stab{background:var(--brass-soft)}
.lrn__lv{font-family:var(--mono);font-size:.6rem;letter-spacing:.03em;color:var(--brass);min-width:3rem}
.lrn__n{font-family:var(--serif);font-weight:600;font-size:.9rem;color:var(--text)}
.lrn__t{font-family:var(--mono);font-size:.55rem;letter-spacing:.05em;text-transform:uppercase;color:var(--verdigris)}
.lrn__m{font-family:var(--mono);font-size:.62rem;color:var(--text-faint);margin-left:auto}
.lrn__e{flex-basis:100%;font-family:var(--cond);font-size:.78rem;color:var(--text-dim);line-height:1.3;padding-left:3.25rem}
.lab__note{font-family:var(--serif);font-size:.86rem;color:var(--text-faint);line-height:1.5;margin-top:1rem}

/* ── STORY ── */
.chap{margin:0 0 2.6rem}
.chap__h{display:flex;align-items:baseline;gap:.75rem;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-bottom:.5rem;margin-bottom:.4rem}

.chap__st{font-family:var(--cond);font-weight:600;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;padding:.12rem .4rem;border:1px solid var(--verdigris);color:var(--verdigris);margin-left:auto}

.chap__beats{flex:1 1 55%;min-width:0}

.chap__scene img{width:100%;height:auto;display:block;border-radius:12px;border:1px solid var(--rule);box-shadow:0 14px 38px rgba(0,0,0,.30)}
.chap__scene figcaption{margin-top:.6rem;line-height:1.5}
.chap__scene .scap__t{display:block;font-family:var(--mono);font-size:.62rem;letter-spacing:.05em;text-transform:uppercase;color:var(--brass);margin-bottom:.3rem}

@media(max-width:840px){.chap__body{flex-direction:column;gap:1.1rem}.chap__scene{position:static;width:100%}}
.proto{display:flex;gap:1.9rem;align-items:center;margin:0 0 2.4rem;flex-wrap:wrap}
.proto__fig{flex:1 1 480px;margin:0;min-width:0}
.proto__fig img{width:100%;height:auto;display:block;border-radius:16px;border:1px solid var(--rule);box-shadow:0 20px 50px rgba(0,0,0,.36)}
.proto__body{flex:1 1 300px;min-width:0}
.proto__k{font-family:var(--mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);margin-bottom:.55rem}
.proto__h{font-family:var(--serif);font-weight:600;font-size:1.55rem;line-height:1.15;margin:0 0 .75rem}
.proto__d{font-size:.98rem;line-height:1.62;color:var(--text-dim)}
.proto__d b{color:var(--text)}
.proto__d .pl{color:var(--brass);font-weight:600}
@media(max-width:720px){.proto{gap:1.15rem}.proto__h{font-size:1.35rem}}
.bt{display:grid;grid-template-columns:5.4ch 1fr;gap:.85rem;padding:.4rem 0;border-bottom:1px dotted var(--rule);align-items:baseline}
.bt:last-child{border-bottom:0}
.bt__i{font-family:var(--mono);font-size:.68rem;color:var(--text-faint)}
.bt__n{font-family:var(--serif);font-size:1rem;color:var(--text-dim)}
.bt.live .bt__n{color:var(--brass);font-weight:600}
.bt.live .bt__i{color:var(--brass)}
.bt__d{font-family:var(--cond);font-size:.85rem;color:var(--text-faint);line-height:1.45;margin-top:.15rem;max-width:70ch}

.arc{border:1px solid var(--rule);margin:1rem 0;background:var(--bg)}
.arc__h{display:flex;align-items:baseline;gap:.7rem;flex-wrap:wrap;padding:1rem 1.1rem;background:var(--bg-raised);border-bottom:1px solid var(--rule)}
.arc__h h3{font-family:var(--serif);font-weight:600;font-size:1.14rem;margin:0}
.arc__c{font-family:var(--mono);font-size:.64rem;color:var(--brass);border:1px solid var(--brass);padding:.05rem .32rem}
.arc__p{font-family:var(--mono);font-size:.64rem;color:var(--text-faint);margin-left:auto}
.arc__b{padding:1rem 1.1rem}
.arc__d{font-family:var(--serif);font-size:.96rem;color:var(--text-dim);line-height:1.58;margin-bottom:.85rem;max-width:70ch}
.arc__l{display:grid;gap:.1rem}
.arc__q{display:grid;grid-template-columns:2.2ch 1fr;gap:.6rem;font-family:var(--cond);font-size:.9rem;color:var(--text-dim);padding:.16rem 0;align-items:baseline}
.arc__q i{font-family:var(--mono);font-size:.62rem;color:var(--text-faint);font-style:normal}

/* ── EXCERPT ── */
.ex{border:1px solid var(--rule);background:var(--bg-raised);padding:1.4rem 1.3rem;margin:1.4rem 0;max-width:70ch}
.ex__h{font-family:var(--mono);font-size:.64rem;color:var(--brass);margin-bottom:.9rem;padding-bottom:.7rem;border-bottom:1px solid var(--rule)}
.ex p:not(.ex__h){font-family:var(--serif);font-size:1rem;line-height:1.66;color:var(--text-dim);margin-bottom:.85rem}
.ex p:last-of-type{margin-bottom:0}
.ex em{color:var(--text);font-style:italic}

.foot{border-top:1px solid var(--rule);margin-top:3.4rem;padding-top:1.4rem}
.foot p{font-family:var(--mono);font-size:.66rem;color:var(--text-faint);line-height:1.75;max-width:70ch}
.foot b{color:var(--brass);font-weight:400}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.001ms!important;animation-duration:.001ms!important}}

/* ═══════════════════════════════════════════════════════════════════════════
   GAME-FORWARD LAYER — richer colour, depth, motion. Layered on top of the
   base chart identity; the world's own hues (brass, verdigris, corruption,
   Pokemax types), never generic neon.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  /* Pokemax type accents — read on both grounds */
  --t-fire:#D65A3A; --t-water:#3B87C4; --t-grass:#4F9E52; --t-ice:#5FB0C6;
  --t-rock:#A98545; --t-flying:#7E86C0; --t-ghost:#8E6BB0; --t-dark:#5A5468;
  --accent:var(--brass);
  --elev:0 1px 2px rgba(8,16,14,.06);
  --elev-lift:0 12px 30px -10px rgba(8,16,14,.30), 0 3px 8px -4px rgba(8,16,14,.16);
}
/* subtle ground depth — a warm brass bloom top-left, cool verdigris pool bottom-right */
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(70vw 55vh at 8% -8%, var(--brass-soft), transparent 60%),
    radial-gradient(60vw 60vh at 108% 108%, var(--verdigris-soft), transparent 62%);
}

/* ── nav: active/hover in each item's own group colour ── */
.nav a:hover{color:var(--text);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.nav a.is-on{color:var(--accent);border-left-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);box-shadow:inset 3px 0 0 var(--accent), inset 0 0 30px -18px var(--accent)}
.nav a.is-on i{color:var(--accent)}
.navgrp__t{position:relative}

/* ── page header: bigger, with an accent tick under the eyebrow ── */
.ph h1{font-size:clamp(2.1rem,4.2vw,3.4rem)}
.ph__e{display:inline-block;color:var(--accent)}
.ph__e::after{content:"";display:block;width:2.2rem;height:2px;background:var(--accent);margin-top:.5rem;border-radius:2px;opacity:.8}

/* ── cards become a rounded "deck": own surface, radius, elevation, accent rail ── */
.grid{gap:.72rem;background:none;border:0;padding:0}
.card{position:relative;overflow:hidden;background:var(--bg-raised);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--elev);transition:transform .16s var(--ease),box-shadow .16s var(--ease),border-color .16s var(--ease)}
.card::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--accent);opacity:0;transition:opacity .16s var(--ease)}
.card:hover{transform:translateY(-3px);box-shadow:var(--elev-lift);border-color:var(--accent);z-index:2}
.card:hover::before{opacity:.9}
.card__n{transition:color .16s var(--ease)}
.card:hover .card__n{color:var(--accent)}
.card__tag{color:var(--accent);border-color:var(--accent)}

/* ── section subheads + tables adopt the page's accent colour ── */
h3.t{color:var(--accent)}
.ph__d{max-width:70ch}
.tw{border-radius:10px}
th{border-bottom:2px solid var(--accent)}
tbody tr:hover td{background:color-mix(in srgb,var(--accent) 9%,transparent)}

/* ── callouts: a touch more presence ── */
.callout{border-left-width:3px;border-radius:0 6px 6px 0;border-left-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.callout--warn{border-left-color:var(--corrupt);background:var(--corrupt-soft)}

/* ── type chips (Pokemax): coloured badges instead of plain text ── */
.tychip{display:inline-flex;align-items:center;gap:.28em;font-family:var(--cond);font-weight:600;font-size:.82rem;letter-spacing:.04em;padding:.08em .5em .1em;border-radius:999px;color:#fff;white-space:nowrap;box-shadow:var(--elev)}
.tychip--fire{background:var(--t-fire)} .tychip--water{background:var(--t-water)}
.tychip--grass{background:var(--t-grass)} .tychip--ice{background:var(--t-ice)}
.tychip--rock{background:var(--t-rock)} .tychip--flying{background:var(--t-flying)}
.tychip--ghost{background:var(--t-ghost)} .tychip--dark{background:var(--t-dark)}

/* ═══ HOME / HERO ═══ */
/* Hero is a self-contained cinematic dark banner over the map — legible and
   consistent in BOTH themes; the themed page starts below its bottom border. */
.hero{position:relative;margin:calc(-1 * clamp(2rem,4vw,3.6rem)) calc(-1 * clamp(1.1rem,3.4vw,3.4rem)) 0;overflow:hidden;border-bottom:1px solid var(--rule-strong);min-height:min(82vh,660px);display:flex;align-items:center;background:#070d0c}
.hero__bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 42%;opacity:.9;filter:saturate(1.08) contrast(1.03)}
.hero__scrim{position:absolute;inset:0;background:
  linear-gradient(94deg, rgba(6,12,11,.86) 0%, rgba(6,12,11,.62) 40%, rgba(6,12,11,.28) 72%, rgba(6,12,11,.42) 100%),
  linear-gradient(0deg, rgba(6,12,11,.7) 0%, rgba(6,12,11,0) 32%)}
.hero__in{position:relative;padding:clamp(2.6rem,6vw,4.6rem) clamp(1.3rem,3.4vw,3.4rem);max-width:1120px;width:100%}
.hero__eyebrow{font-family:var(--cond);font-weight:600;font-size:.76rem;letter-spacing:.28em;text-transform:uppercase;color:#D9A84E;margin:0}
.hero__t{margin:.7rem 0 0}
.hero__the{display:block;font-family:var(--cond);font-weight:600;font-size:clamp(.9rem,2.4vw,1.15rem);letter-spacing:.5em;text-transform:uppercase;color:#D9A84E;margin:0 0 .15rem;padding-left:.15em}
.hero__big{display:block;font-family:var(--serif);font-weight:700;font-size:clamp(3.2rem,11vw,7rem);line-height:.86;letter-spacing:-.022em;color:#F5F0E4;text-shadow:0 6px 50px rgba(0,0,0,.6)}
.hero__sub{font-family:var(--serif);font-size:clamp(1.04rem,1.7vw,1.28rem);color:rgba(238,235,226,.82);margin:1.3rem 0 0;max-width:52ch;line-height:1.55}
.hero__stats{display:flex;flex-wrap:wrap;gap:.55rem;margin:1.8rem 0 0}
.stat{background:rgba(255,255,255,.06);border:1px solid rgba(238,235,226,.24);border-radius:999px;padding:.42rem 1rem;display:flex;align-items:baseline;gap:.42rem;backdrop-filter:blur(4px)}
.stat b{font-family:var(--mono);font-size:1.08rem;color:#E3B45C;font-variant-numeric:tabular-nums}
.stat span{font-family:var(--cond);font-weight:600;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(238,235,226,.72)}
.hero__cta{display:flex;flex-wrap:wrap;gap:.75rem;margin:2rem 0 0}
.hbtn{display:inline-flex;align-items:center;gap:.45rem;white-space:nowrap;line-height:1;font-family:var(--cond);font-weight:600;font-size:.84rem;letter-spacing:.14em;text-transform:uppercase;padding:.8rem 1.6rem;border-radius:7px;text-decoration:none;cursor:pointer;transition:transform .14s var(--ease),box-shadow .14s var(--ease),background .14s var(--ease),border-color .14s var(--ease);border:1px solid transparent}
.hbtn--primary{background:#C79A4B;color:#1a130a;box-shadow:0 8px 24px -8px rgba(199,154,75,.6)}
.hbtn--primary:hover{transform:translateY(-2px);box-shadow:0 14px 34px -8px rgba(199,154,75,.7);background:#D3A85A}
.hbtn--ghost{background:rgba(255,255,255,.05);color:#F5F0E4;border-color:rgba(238,235,226,.34);backdrop-filter:blur(4px)}
.hbtn--ghost:hover{border-color:#D9A84E;color:#E3B45C;transform:translateY(-2px)}

.home__lead{font-family:var(--serif);font-size:1.1rem;line-height:1.62;color:var(--text-dim);max-width:64ch;margin:2.4rem 0 0}
.newbie{display:flex;flex-wrap:wrap;align-items:center;gap:.7rem 1.2rem;margin:1.5rem 0 0;padding:1.05rem 1.25rem;border:1px solid var(--rule);border-left:3px solid #2FA3A3;border-radius:12px;background:var(--bg-raised)}
.newbie__t{font-family:var(--serif);font-size:1.02rem;line-height:1.5;color:var(--text-dim);margin:0;flex:1 1 260px}
.newbie__t b{color:var(--text)}
.newbie a{font-family:var(--cond);font-size:.82rem;letter-spacing:.03em;text-transform:uppercase;color:#2FA3A3;border:1px solid #2FA3A3;padding:.4rem .7rem;border-radius:8px;white-space:nowrap;text-decoration:none;transition:background .15s,color .15s}
.newbie a:hover{background:#2FA3A3;color:#08201F}
.syswrap{margin:2rem 0 0}
.sysgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:.9rem;margin:1rem 0 0}
.syscard{position:relative;display:block;text-decoration:none;background:var(--bg-raised);border:1px solid var(--rule);border-radius:10px;padding:1.2rem 1.2rem 1.3rem;overflow:hidden;transition:transform .18s var(--ease),box-shadow .18s var(--ease),border-color .18s var(--ease);box-shadow:var(--elev)}
.syscard::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--sc,var(--brass))}
.syscard:hover{transform:translateY(-4px);box-shadow:var(--elev-lift);border-color:var(--sc,var(--brass))}
.syscard__i{font-size:1.7rem;line-height:1}
.syscard__t{font-family:var(--serif);font-weight:600;font-size:1.18rem;color:var(--text);margin:.6rem 0 0}
.syscard__d{font-family:var(--cond);font-size:.9rem;color:var(--text-dim);line-height:1.45;margin:.3rem 0 0}
.syscard__go{font-family:var(--cond);font-weight:600;font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--sc,var(--brass));margin:.8rem 0 0;display:inline-block}

/* ── entry motion (hero + reveal) ── */
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.anim{opacity:0;animation:riseIn .6s var(--ease) forwards}
.anim.d1{animation-delay:.06s} .anim.d2{animation-delay:.14s} .anim.d3{animation-delay:.24s} .anim.d4{animation-delay:.34s} .anim.d5{animation-delay:.44s}
.reveal{opacity:0;transform:translateY(16px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.anim,.reveal{opacity:1!important;transform:none!important;animation:none!important}}

/* ═══ CHARACTER SHOWCASE ═══ */
.charwrap{display:flex;flex-direction:column;gap:1.6rem;margin:1.6rem 0}
.charcard{display:flex;background:var(--bg-raised);border:1px solid var(--rule);border-radius:16px;overflow:hidden;box-shadow:var(--elev);transition:transform .18s var(--ease),box-shadow .18s var(--ease),border-color .18s var(--ease)}
.charcard:hover{transform:translateY(-3px);box-shadow:var(--elev-lift);border-color:var(--ca)}
.charcard--r{flex-direction:row-reverse}
.charcard__art{flex:0 0 clamp(220px,30%,320px);position:relative;background:#0a1522;min-height:100%}
.charcard__art img{display:block;width:100%;height:100%;object-fit:cover;object-position:top center}
.charcard__glow{position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg, color-mix(in srgb,var(--bg-raised) 92%,transparent) 0%, transparent 22%), radial-gradient(120% 60% at 50% 0%, color-mix(in srgb,var(--ca) 26%,transparent), transparent 70%)}
.charcard--r .charcard__glow{background:linear-gradient(0deg, color-mix(in srgb,var(--bg-raised) 92%,transparent) 0%, transparent 22%), radial-gradient(120% 60% at 50% 0%, color-mix(in srgb,var(--ca) 26%,transparent), transparent 70%)}
.charcard__body{flex:1;min-width:0;padding:clamp(1.4rem,3vw,2.2rem)}
.charcard__role{font-family:var(--cond);font-weight:600;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ca);margin:0}
.charcard__name{font-family:var(--serif);font-weight:700;font-size:clamp(1.8rem,3.4vw,2.7rem);line-height:1;letter-spacing:-.02em;color:var(--text);margin:.35rem 0 0}
.charcard__alias{font-family:var(--serif);font-style:italic;font-weight:400;font-size:.6em;color:var(--ca);margin-left:.3em}
.charcard__facts{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0 0}

.charcard__q{font-family:var(--serif);font-style:italic;font-size:clamp(1.1rem,1.8vw,1.35rem);line-height:1.4;color:var(--text);margin:1.2rem 0 0;padding-left:1rem;border-left:3px solid var(--ca)}
.charcard__d{font-family:var(--serif);font-size:1rem;line-height:1.62;color:var(--text-dim);margin:.9rem 0 0;max-width:60ch}

@media(max-width:720px){

}

/* ── STORY ── */
var CH1=[["1","A Destined Encounter","An old man named Gorim finds you on the forest road south and presses a sealed scroll into your hands, telling you what you are before you have any reason to believe it: one of the Guardians. His only instruction is a place — Stormbay. The bandits already working the road have their own plans for whoever is carrying that scroll."],
 ["2","A Destined Encounter","The ambush is not finished with you. You cut your way clear of the trees with the scroll still on you and Gorim's words still landing — the seal on Azroth is failing, and somehow that is your problem now. The road to Stormbay opens ahead, and nothing about it feels safe."],
 ["3","The Enemy of my Enemy is my Friend","Black Lotus Wood, where a woman with two pistols is fighting off a pack of Wealth Hunters who picked the wrong target. You wade in on her side. She does not thank you — people who fight like that rarely do."],
 ["4","Jessie, the Mercenary","Instead of gratitude you get an interrogation: she wants to know about the scroll, not your name. Then more bandits turn up to make her point for her. She fights at your side anyway, and when it is over she comes along — on her own terms, watching you the whole way."],
 ["5","What's Written in the Scroll","Jessie catches a mark the rest of you missed — a black-market sigil for a forger called The Scribe, somewhere in Stormbay. It is your first real lead. Frogst scouts hit the road before you can follow it."],
 ["6","Welcome to Stormbay","The city gates know Jessie by name, and not fondly — a tab at The Broken Anchor and a reputation everywhere else. You fight your way in past guards who were expecting her. From a balcony above, a cloaked figure watches you do it and says nothing."],
 ["7","Two Strangers at the Docks","The Salt & Rope, and a barkeep named Bertram who points you one name deeper: talk to Cara first. Between drinks you learn the shape of the thing hunting you — Valdris has been in Stormbay four days already, buying loyalties and asking after the very scroll you carry."],
 ["8","The Woman Who Knows Everything","Cara runs a pawnshop on the South Docks with a loaded crossbow and a history with Jessie that neither will explain. She gives up The Scribe — Elric, blue door, Clock Tower district — just as Valdris's personal guard kicks in the door to collect you both."],
 ["9","The Blue Door","You break Valdris's men and find the blue door, and behind it Elric: the scholar who has given thirty years to a dead script. The scroll, he says, names three places and carries two hands — Gorim's, and the Varn family's. Then Valdris's people arrive downstairs."],
 ["10","One Night at Cara's","Back at the shop, Elric reads the whole thing aloud for the first time: Aldenmoor, Veldran, Mirefall — three points tied to the seal. At the word Veldran, Jessie goes still and says nothing, and Cara admits she knows where the last of the Varns is hiding."],
 ["11","The Last Varn","Maren Varn, thirty years unseen, in the old district. Her family built the seal mechanism itself, and she still holds the key to Aldenmoor's northeast door. She also remembers a couple who walked this same road thirty years ago — a woman with a fighter's hands, a man who talked too much — and Jessie, listening, says nothing at all. Maren gives you the key."],
 ["12","What the Harbor Knows","Jessie takes you up to the rooftop where she grew up and tells you the truth she tells no one: she was found in the Greywood as a baby and has never known whose she is. Below, among the boats, a thirty-foot circle of dead-still water sits in the harbour — and not one person on the docks will look at it."],
 ["13","One Last Night","Valdris stops pretending — arrest warrants, issued through the city's own courts. The plan is Pier 7 and a boat called the Grey Maren, and Jessie makes you promise that if it goes wrong, you get on it. Valdris comes early, and the group is torn apart in the streets."],
 ["14","The Grey Maren","You cut a path to the pier alone. Jessie makes it — and so do the Frogst Brothers, Barrel and Hammer, come for you in person. She holds both of them off, cuts the rope, and tells you to jump. The last thing you see of Stormbay is her back, two pistols up, facing them both at once. End of Chapter One."]];
var CH2=[["15","Landfall","An unnamed cove far up the coast, and you are furious that Jessie is not on the boat. Elric makes you hear it plainly: she made her own choice, and it was never yours to stop. Then you notice the dark, still-water circle has followed you here — and Valdris's tracker is already on the sand."],
 ["16","Two Days North","The coast road, and two days of Elric slowly confessing what thirty years of study cost him. Somewhere along the way you pass a stretch of shoreline with no birds on it at all — the kind of silence that means Azroth, not weather."],
 ["17","Ravennor","The town of Ravennor and an inn called the Stonefish. Over a table an old man mentions travellers who went north years ago and came back wrong, if they came back at all. The local collectors decide you look like an easy purse."],
 ["18","Old Names","In Ravennor's archive Elric finds them: two names, travellers from thirty years ago — the couple Maren described. He does not read them aloud. He folds the page away until he can be certain, and Valdris's professional hunters find you before he can change his mind."],
 ["19","She'll Find You","Valdris's Lieutenant springs the road with real soldiers and two waves behind them. Cornered with Elric at your back, you finally open the note Cara pressed on you — 'She'll find you. She always finds what she is looking for.' On cue, Jessie tears the enemy flank apart alone: 'Took you long enough to open that.'"],
 ["20","The Night After","The first night the team is whole. Jessie stitches Elric up before he can ask, tells you in her sideways way that it is good to see you, and finally asks the question she has been holding: where, exactly, are you all going? A short fight in the dark — and for the first time she stands with you as one of your own."],
 ["21","Aldenmoor","The ruins at last, and the Hollow are already on the refugees — eyeless things born of Azroth's seepage that come apart into smoke when they fall. You end the attack before its leader arrives. When Garrick finally reaches you, he checks on his people before he says a single word to the strangers who just saved them."],
 ["22","The Vault Roads","Garrick decides to come down himself — he has seen something worth hoping for in you and Jessie — and leaves Elric up top. The old tunnels swallow you whole, and the Hollow are waiting exactly where the passage narrows to a throat."],
 ["23","What the Tunnels Remember","Deeper still, down to the spot where Garrick's brother died on the last failed run — a debt he carries without a word. And threaded through the dark, a thin, deliberate trace of the travellers from thirty years ago, left unspoken and unresolved."],
 ["24","The Last Ward","The central chamber, and the thing the Varns left to guard it: a construct that has held this door far longer than anyone alive has drawn breath. Past it lie both the settlement's sealed stores and the first piece of the seal itself."],
 ["25","The Vanguard at the Gate","Valdris finally stops chasing the team and does the crueler thing. He does not come for you. He comes for the settlement — the people you just bled to save."],
 ["26","The Siege of Aldenmoor","The full siege: every fighter Aldenmoor has left against everything Valdris brought. Garrick's maul, Jessie's pistols, your blade, and the walls buying time by the second. The end of Chapter Two."]];
var CH3=[["27","What You Leave Behind","Aldenmoor in the after-quiet. You count what the siege took, patch what can still be patched, and decide what — and who — you are carrying east from here. Everything ahead now points at Veldran."],
 ["28","What the Roads Cost","The road east gives nothing away for free. Miles, weather, watchers on the ridgelines, and the slow bill that long travel always sends — paid one hard stretch at a time."],
 ["29","Before the Transfer","Ironhollow, and a secret already in transit. Something is being moved out under guard, and there is a narrow window before it is gone for good — if you are willing to be somewhere you should not be."],
 ["30","First Light","The convoy job, taken at dawn because dawn is when the guard is thinnest and the light is on your side. Quick, cold, and finished before the town is properly awake."],
 ["31","The Road Climbs","Ironhollow behind you and the mountain pass ahead. Davan presses a hand-drawn map of the approach into Jessie's hands; Ren gives her a nod instead of words. Both of them clearly expect to see her come back down."],
 ["32","Rocky Chill Pass","The pass, and fresh boot marks in the ice that are not theirs. Valdris scouts, a letter meant for a Councilor in Veldran, and — with the city finally in sight below — Jessie saying, for the first time, why the name stops her."],
 ["33","The East Gate","Down out of the mountains and into Veldran at last. A Valdris unit takes the long way round to catch them on the flat, and past it the city opens up: a council of five, a founding relic nobody has ever questioned — and Jessie walking the streets like someone who used to live here, because she did."],
 ["34","Home","Jessie leads them into the council district, to the door of the man who raised her — Bren Valos, one of Veldran's five senators, watched already by Valdris's agents. The relic plot and Jessie's past turn out to be the same man. He takes them in, feeds them, and watches."],
 ["35","The Auction","Bren makes calls and comes back with the shape of it: the relic is not being stolen, it is being sold. An official auction at a council reception, three nights out, with the bidding already quietly fixed for Valdris. The plan becomes a heist in eveningwear — get into the room as Bren's guests and make the sale impossible before the gavel falls."],
 ["36","Zoe","Bren sends for the one person who knows the council receptions cold — Zoe, Jessie's childhood friend, cheerful and fearless and impossible to un-invite. She maps the whole reception from memory, runs headlong at an ambush in the market, and comes out grinning. Jessie fights her joining every step, and lets her stay anyway."],
 ["37","The Gala","The heist itself. Elric's replica is finished and Bren splits the room five ways — Jessie holds the auction floor and bids Valdris's buyer Soran Kael to a standstill, you and Zoe take the east corridor to swap the relic, Garrick watches Kael, Elric times the patrol window down to the second. Jessie loses the argument over Zoe going with you, then settles whatever it was in one word outside. Two planted guards in the corridor go down quiet and clean, and the auction bell rings over two hundred guests who have no idea what is about to happen."],
 ["38","The Bid","The auction is live. Jessie bids Soran Kael up past anything Bren called reasonable and starts, plainly, to enjoy it — Bren says she was always like this with things she decided to win. While the room watches the table, you and Zoe slip the exclusive corridor (she waves you through the checkpoint as her overwhelmed cousin), put down an inner Valdris patrol that was never in her notes, and reach the relic chamber. Zoe opens it with a key she quietly arranged herself. You are inside now, replica in hand, the real relic three steps away, while Jessie keeps Kael climbing."]];

function tbl(head,rows,cls){
  var h='<div class="tw"><table><thead><tr>'+head.map(function(x){return "<th>"+E(x)+"</th>";}).join("")+"</tr></thead><tbody>";
  h+=rows.map(function(r){
    return "<tr>"+r.map(function(c,i){return '<td class="'+((cls&&cls[i])||"")+'">'+c+"</td>";}).join("")+"</tr>";
  }).join("");
  return h+"</tbody></table></div>";
}
function cards(items){ return '<div class="grid grid--wide">'+items.join("")+"</div>"; }
/* HP/part bar exactly like make_hp_bar / make_part_bar: █ filled, ░ empty */
function hpbar(cur,max,len){
 len=len||12; var f=Math.floor(len*Math.max(0,Math.min(1,cur/max)));
 return "["+"█".repeat(f)+"░".repeat(len-f)+"]";
}
/* pet hp_bar: ▰ filled, ▱ empty, width 10, round() — pet_battle_system.hp_bar */
function petbar(cur,max){
 var f=Math.max(0,Math.min(10,Math.round(10*cur/Math.max(1,max))));
 return "▰".repeat(f)+"▱".repeat(10-f);
}
/* a Discord embed card: accent color, title, pre-built body HTML, footer */
function dsc(accent,title,body,footer){
 return '<div class="dsc" style="--dsc-accent:'+accent+'">'+
  '<p class="dsc__t">'+title+'</p>'+body+
  (footer?'<p class="dsc__ft">'+footer+'</p>':'')+'</div>';
}

 '<div class="callout"><p>'+L("🔆 <strong>Focus is your super-punch.</strong> A <em>successful</em> Rest gives you Focus, and your <strong>next</strong> attack then does <strong>double (×2) damage</strong>. Save it for a moment that counts!","🔆 <strong>Focus es tu súper-golpe.</strong> Un Rest <em>exitoso</em> te da Focus, y tu <strong>siguiente</strong> ataque hace <strong>el doble (×2) de daño</strong>. ¡Guárdalo para un momento que cuente!")+'</p></div>'+
 '<div class="callout callout--warn"><p>'+L("⚠️ <strong>Resting is risky — do not Rest into a hit!</strong> If an enemy attacks you on the turn you Rest, you get <strong>caught off guard</strong>: your Rest <strong>fails completely</strong> — <strong>no heal, no Focus</strong> — <em>and</em> they hit you for <strong>extra</strong> damage (about 50% more) for catching you resting. Only Rest when you are <strong>safe</strong> from a hit.","⚠️ <strong>Descansar es arriesgado — ¡no hagas Rest ante un golpe!</strong> Si un enemigo te ataca en el turno que haces Rest, te pillan <strong>con la guardia baja</strong>: tu Rest <strong>falla por completo</strong> — <strong>sin cura, sin Focus</strong> — <em>y</em> te pegan con daño <strong>extra</strong> (un 50% más) por pillarte descansando. Solo descansa cuando estés <strong>a salvo</strong> de un golpe.")+'</p></div>'+
 '<h2 class="s">'+L("A whole fight, step by step","Una pelea completa, paso a paso")+'</h2>'+
 '<p class="b">'+L("Meet the two fighters. We will use easy round numbers:","Te presento a los dos luchadores. Usaremos números redondos y fáciles:")+'</p>'+
 '<div class="callout"><p>'+L("🦸 <strong>You</strong> — 120 HP · your attacks do about <strong>30</strong> damage · a safe Rest heals about <strong>35</strong>.<br>👹 <strong>Goblin</strong> — 90 HP · its attacks do about <strong>20</strong> damage.","🦸 <strong>Tú</strong> — 120 HP · tus ataques hacen unos <strong>30</strong> de daño · un Rest seguro cura unos <strong>35</strong>.<br>👹 <strong>Goblin</strong> — 90 HP · sus ataques hacen unos <strong>20</strong> de daño.")+'</p></div>'+
 tbl(L(["Turn","You press","What happens"],["Turno","Pulsas","Qué pasa"]),LANG==="es"?[
  ["1",'⚔️ <strong>Attack</strong>',"Golpeas al Goblin por 30. <strong>Goblin: 90 → 60.</strong> Contraataca: <strong>Tú: 120 → 100.</strong>"],
  ["2",'💤 <strong>Rest</strong> — ¡mal momento!',"El Goblin ataca mientras descansas, así que te pilla <strong>con la guardia baja</strong>: tu Rest falla — <strong>sin cura, sin Focus</strong> — y te pega por <strong>30</strong> (50% más de lo normal). <strong>Tú: 100 → 70.</strong>"],
  ["3",'⚔️ <strong>Attack</strong>',"Golpeas por 30. <strong>Goblin: 60 → 30.</strong> Ahora el Goblin está herido y <em>él</em> hace Rest para curarse."],
  ["4",'💤 <strong>Rest</strong> — ¡ahora sí!',"El Goblin está descansando, no atacando, así que estás a salvo. Te curas ~35 <em>y</em> ganas Focus 🔆. <strong>Tú: 70 → 105.</strong> (El Goblin se cura un poco: 30 → 45.)"],
  ["5",'⚔️ <strong>Attack</strong> (¡con Focus!)',"Focus <strong>duplica</strong> tu golpe: 30 × 2 = <strong>60</strong>. <strong>Goblin: 45 → 0.</strong> ¡Ganas! 🎉"]
 ]:[
  ["1",'⚔️ <strong>Attack</strong>',"You hit the Goblin for 30. <strong>Goblin: 90 → 60.</strong> It swings back: <strong>You: 120 → 100.</strong>"],
  ["2",'💤 <strong>Rest</strong> — bad timing!',"The Goblin attacks while you rest, so it <strong>catches you off guard</strong>: your Rest fails — <strong>no heal, no Focus</strong> — and it hits you for <strong>30</strong> (50% more than usual). <strong>You: 100 → 70.</strong>"],
  ["3",'⚔️ <strong>Attack</strong>',"You hit for 30. <strong>Goblin: 60 → 30.</strong> Now the Goblin is hurt and <em>it</em> Rests to heal itself."],
  ["4",'💤 <strong>Rest</strong> — safe now!',"The Goblin is resting, not attacking, so you are safe. You heal ~35 <em>and</em> gain Focus 🔆. <strong>You: 70 → 105.</strong> (The Goblin heals a little: 30 → 45.)"],
  ["5",'⚔️ <strong>Attack</strong> (with Focus!)',"Focus <strong>doubles</strong> your hit: 30 × 2 = <strong>60</strong>. <strong>Goblin: 45 → 0.</strong> You win! 🎉"]
 ],["n","k",""])+
 '<p class="b">'+L("The whole lesson is in <strong>turns 2 and 4</strong>. Resting is powerful — a free heal <em>plus</em> a Focus power-up — but only if <strong>no one hits you</strong> that turn. Rest into an attack (turn 2) and you get nothing and take extra damage. Wait for a safe moment (turn 4, while the enemy is resting too), then Rest, then unleash your Focus hit.","Toda la lección está en los <strong>turnos 2 y 4</strong>. Descansar es poderoso — cura gratis <em>más</em> el power-up de Focus — pero solo si <strong>nadie te golpea</strong> ese turno. Descansa ante un ataque (turno 2) y no consigues nada y recibes daño extra. Espera un momento seguro (turno 4, mientras el enemigo también descansa), luego haz Rest, y suelta tu golpe con Focus.")+'</p>'+
 '<h2 class="s">'+L("Three simple tips","Tres consejos simples")+'</h2>'+
 tbl(L(["Tip","Why"],["Consejo","Por qué"]),LANG==="es"?[
  ["Descansa solo cuando sea seguro","Nunca hagas Rest ante un ataque — no te curas, no ganas Focus, y recibes daño extra. Descansa cuando el enemigo esté bajo, ocupado con otro, o también descansando."],
  ["Gasta Focus en un golpe grande","Un ataque duplicado es tu mejor jugada. Prepáralo cuando el enemigo no pueda esquivar ni bloquear."],
  ["Haz Parry solo si viene un golpe","Si haces Parry y el enemigo no ataca, malgastaste tu turno. Lee lo que está haciendo."]

 '<div class="callout"><p>'+L("🎓 That is the entire game! Everything else — your stats, your gear, your weapon — just changes these numbers up or down. When you want the real formulas behind the damage and healing, read the full <a href=\"#combat\">Combat</a> page.","🎓 ¡Ese es todo el juego! Todo lo demás — tus stats, tu equipo, tu arma — solo sube o baja estos números. Cuando quieras las fórmulas reales del daño y la cura, lee la página completa de <a href=\"#combat\">Combate</a>.")+'</p></div>';

PAGES["tut-pokemax"]={t:"Pokemax Basics",e:"Tutorial",d:"Your first Pokemax battle, step by step — types, HP, and how to catch one. Beginner friendly.",h:function(){
 return '<h2 class="s">'+L("What a Pokemax battle is","Qué es un combate Pokemax")+'</h2>'+
 '<p class="b">'+L("You bring a team of up to <strong>three Pokemax</strong>, but only <strong>one fights at a time</strong> — like a tag-team. Each Pokemax has its own <strong>HP</strong>. When a Pokemax\'s HP reaches <strong>0</strong> it <strong>faints</strong> and leaves the battle.","Llevas un equipo de hasta <strong>tres Pokemax</strong>, pero solo <strong>uno pelea a la vez</strong> — como un relevo. Cada Pokemax tiene su propio <strong>HP</strong>. Cuando el HP de un Pokemax llega a <strong>0</strong> se <strong>debilita</strong> y sale del combate.")+'</p>'+
 '<p class="b">'+L("You <strong>win</strong> when all three of the enemy\'s Pokemax have fainted. It is still turn-based: you pick a move, they pick a move, and the faster Pokemax goes first.","<strong>Ganas</strong> cuando los tres Pokemax del enemigo se han debilitado. Sigue siendo por turnos: eliges un movimiento, ellos eligen uno, y el Pokemax más rápido va primero.")+'</p>'+
 '<h2 class="s">'+L("Types beat each other (like rock-paper-scissors)","Los tipos se ganan entre sí (como piedra-papel-tijera)")+'</h2>'+
 '<p class="b">'+L("Every Pokemax — and every move — has a <strong>type</strong>. Some types beat others. When your move\'s type beats the enemy\'s type, it is <strong>super effective</strong> and does <strong>double (×2) damage</strong>. Here is the simplest circle to remember:","Cada Pokemax — y cada movimiento — tiene un <strong>tipo</strong>. Algunos tipos ganan a otros. Cuando el tipo de tu movimiento gana al del enemigo, es <strong>súper eficaz</strong> y hace <strong>el doble (×2) de daño</strong>. Este es el círculo más fácil de recordar:")+'</p>'+
 '<div class="callout"><p>'+L("🔥 <strong>Fire</strong> beats 🌿 <strong>Grass</strong> &nbsp;→&nbsp; 🌿 <strong>Grass</strong> beats 🌊 <strong>Water</strong> &nbsp;→&nbsp; 🌊 <strong>Water</strong> beats 🔥 <strong>Fire</strong> &nbsp;→&nbsp; and back to the start.","🔥 <strong>Fire</strong> gana a 🌿 <strong>Grass</strong> &nbsp;→&nbsp; 🌿 <strong>Grass</strong> gana a 🌊 <strong>Water</strong> &nbsp;→&nbsp; 🌊 <strong>Water</strong> gana a 🔥 <strong>Fire</strong> &nbsp;→&nbsp; y de vuelta al inicio.")+'</p></div>'+
 '<p class="b">'+L("So a Fire move against a Grass Pokemax hits for double. But that same Fire Pokemax is weak to Water. <strong>Bringing the right type matters more than being a higher level.</strong>","Así, un movimiento de tipo Fire contra un Pokemax Grass pega el doble. Pero ese mismo Pokemax Fire es débil a Water. <strong>Llevar el tipo correcto importa más que tener más nivel.</strong>")+'</p>'+
 '<h2 class="s">'+L("Moves run out","Los movimientos se agotan")+'</h2>'+
 '<p class="b">'+L("Each Pokemax knows up to <strong>four moves</strong>, and every move has <strong>PP</strong> — the number of times you can use it. Use a move and its PP drops by one. If every move runs out, your Pokemax can only do a weak <strong>Struggle</strong>, so do not waste your strong move on an easy foe.","Cada Pokemax conoce hasta <strong>cuatro movimientos</strong>, y cada uno tiene <strong>PP</strong> — la cantidad de veces que puedes usarlo. Usa un movimiento y su PP baja en uno. Si se agotan todos, tu Pokemax solo puede hacer un débil <strong>Struggle</strong>, así que no gastes tu movimiento fuerte en un rival fácil.")+'</p>'+
 '<h2 class="s">'+L("A battle, step by step","Un combate, paso a paso")+'</h2>'+
 '<div class="callout"><p>'+L("🔥 <strong>Your Cinderling</strong> (Fire) — 33 HP · knows <strong>Ember</strong>, a Fire move.<br>🌿 <strong>Wild Grass Pokemax</strong> — 30 HP.","🔥 <strong>Tu Cinderling</strong> (Fire) — 33 HP · conoce <strong>Ember</strong>, un movimiento de Fire.<br>🌿 <strong>Pokemax Grass salvaje</strong> — 30 HP.")+'</p></div>'+
 tbl(L(["Turn","You choose","What happens"],["Turno","Eliges","Qué pasa"]),LANG==="es"?[
  ["1",'🔥 <strong>Ember</strong>',"Fire gana a Grass, así que es <strong>súper eficaz</strong> — un golpe normal de ~10 se vuelve <strong>~20</strong>. <strong>Salvaje: 30 → 10.</strong>"],
  ["2",'🔥 <strong>Ember</strong> otra vez',"Otro golpe ×2. <strong>Salvaje: 10 → 0.</strong> Se debilita — ¡ganas el combate! 🎉"]
 ]:[
  ["1",'🔥 <strong>Ember</strong>',"Fire beats Grass, so it is <strong>super effective</strong> — a normal ~10 hit becomes <strong>~20</strong>. <strong>Wild: 30 → 10.</strong>"],
  ["2",'🔥 <strong>Ember</strong> again',"Another ×2 hit. <strong>Wild: 10 → 0.</strong> It faints — you win the battle! 🎉"]
 ],["n","k",""])+
 '<p class="b">'+L("Two moves, because you picked the type that wins. A wrong-type move might have taken five or six.","Dos movimientos, porque elegiste el tipo que gana. Un movimiento de tipo equivocado habría tardado cinco o seis.")+'</p>'+
 '<h2 class="s">'+L("Catching a wild Pokemax","Capturar un Pokemax salvaje")+'</h2>'+
 '<p class="b">'+L("If a Pokemax is <strong>wild</strong> and you want to keep it, do <strong>not</strong> knock it out — a fainted Pokemax cannot be caught. Instead:","Si un Pokemax es <strong>salvaje</strong> y quieres quedártelo, <strong>no</strong> lo dejes fuera de combate — un Pokemax debilitado no se puede capturar. En su lugar:")+'</p>'+
 tbl(L(["Step","Do this"],["Paso","Haz esto"]),LANG==="es"?[
  ["1","<strong>Debilítalo.</strong> Bájale el HP — pero déjalo con vida."],
  ["2","<strong>Añade un Estado.</strong> Duérmelo o congélalo — eso hace la captura mucho más fácil."],
  ["3","<strong>Lanza una OILball.</strong> Cuanto más bajo su HP y mejor tu OILball, mayor tu probabilidad de capturarlo."]
 ]:[
  ["1","<strong>Weaken it.</strong> Chip its HP down low — but leave it alive."],
  ["2","<strong>Add a Status.</strong> Put it to Sleep or Freeze it — that makes catching much easier."],
  ["3","<strong>Throw an OILball.</strong> The lower its HP and the better your OILball, the higher your chance to catch it."]
 ],["n",""])+
 '<div class="callout"><p>'+L("🎣 Throwing an OILball at a <strong>full-health</strong> Pokemax almost never works — always weaken it first. The full catching maths is on the <a href=\"#catching\">Catching</a> page.","🎣 Lanzar una OILball a un Pokemax a <strong>HP completo</strong> casi nunca funciona — debilítalo primero. Toda la matemática de captura está en la página de <a href=\"#catching\">Captura</a>.")+'</p></div>'+
 '<div class="callout"><p>'+L("🎓 Ready for more? The <a href=\"#petbattle\">Pokemax Battles</a> page has every type, all the moves and the status effects. This same fight, with the full rules.","🎓 ¿Listo para más? La página de <a href=\"#petbattle\">Combates Pokemax</a> tiene todos los tipos, todos los movimientos y los estados. Esta misma pelea, con las reglas completas.")+'</p></div>';
}};

PAGES.start={t:"Getting Started",e:"The guide",d:"There is no registration. Your account is created the first time you make a profile from the Kiosk, or the first time you join a game — whichever happens first.",h:function(){

 '<p>'+L("Everything on this site describes the bot as it actually runs on <strong>the server the bot lives in</strong>. Reward amounts, drop rates, daily caps, prices and which panels are up are set by Max, and the defaults listed here are what he starts from.","Todo en este sitio describe el bot tal como funciona en <strong>el servidor donde vive el bot</strong>. Las recompensas, tasas de drop, límites diarios, precios y qué paneles están activos los define Max, y los valores por defecto listados aquí son de los que él parte.")+'</p></div>'+

PAGES.combat={t:"Combat",e:"The guide",d:"Every turn, against players and NPCs alike, runs on four actions and the arithmetic below. These are the real formulas the bot runs.",h:function(){
 return '<h2 class="s">'+L("The three stats","Los tres stats")+'</h2>'+
 '<p class="b">'+L("Your point budget grows with your level and is never unlimited:","Tu presupuesto de puntos crece con tu nivel y nunca es ilimitado:")+'</p>'+
 '<span class="fx">'+L("total stat points = 10 + (global level − 1)","puntos de stat totales = 10 + (nivel global − 1)")+'</span>'+
 '<h3 class="t">'+L("STR — Strength","STR — Fuerza")+'</h3>'+
 '<p class="b">'+L("Raw damage. Each point adds <strong>+4</strong> to your base attack on top of a random 5–15 roll, and it strengthens both halves of your Parry.","Daño puro. Cada punto suma <strong>+4</strong> a tu ataque base sobre una tirada aleatoria de 5–15, y refuerza ambas mitades de tu Parry.")+'</p>'+
 '<span class="fx">'+L("base damage = (STR × 4) + random(5–15)","daño base = (STR × 4) + aleatorio(5–15)")+'</span>'+
 '<h3 class="t">'+L("AGI — Agility","AGI — Agilidad")+'</h3>'+
 '<p class="b">'+L("The strongest stat in the game, because it does <strong>four</strong> things at once: it multiplies your damage (Overcrit), sets your crit chance, sets your dodge chance, and removes flat damage from every hit you take.","El stat más fuerte del juego, porque hace <strong>cuatro</strong> cosas a la vez: multiplica tu daño (Overcrit), fija tu probabilidad de crítico, fija tu probabilidad de esquiva, y quita daño plano de cada golpe que recibes.")+'</p>'+
 '<span class="fx">'+L("overcrit ≈ 1 + 0.5 × (AGI ÷ 29)   ·   flat reduction = AGI × 2.5","overcrit ≈ 1 + 0.5 × (AGI ÷ 29)   ·   reducción plana = AGI × 2.5")+'</span>'+
 tbl(L(["AGI","Crit &amp; dodge chance"],["AGI","Prob. de crítico y esquiva"]),[["0","0%"],["5","5%"],["10","10%"],["13","11%"],["16","12%"],["20","13%"],["40","20%"]],["n",""])+
 '<p class="b">'+L("Up to AGI 10 each point is +1%. Above 10 it slows to roughly +1% per 3 AGI.","Hasta AGI 10, cada punto es +1%. Por encima de 10 baja a aproximadamente +1% por cada 3 de AGI.")+'</p>'+
 '<h3 class="t">'+L("CON — Constitution","CON — Constitución")+'</h3>'+
 '<span class="fx">'+L("max HP = 50 + (CON × 15)   ·   rest heal = 20 + (CON × 3)","HP máx = 50 + (CON × 15)   ·   cura de Rest = 20 + (CON × 3)")+'</span>'+

 '<h2 class="s">'+L("NPC passives","Pasivas de NPC")+'</h2>'+

PAGES.consumables={t:"Consumables",e:"The guide",d:"Bought from the Shop panel with Oil Coins, stored in your bag, used on your turn. Prices are set by Max — these are the standard defaults.",h:function(){

 '<div class="callout"><p>'+L("The <strong>Guard Potion</strong> is the flat &minus;50% next hit. The <strong>Parry action</strong> is a separate block-and-counter mechanic — they are not the same thing.","La <strong>Guard Potion</strong> es el &minus;50% plano al próximo golpe. La <strong>acción Parry</strong> es una mecánica aparte de bloqueo-y-contra — no son lo mismo.")+'</p></div>'+
 '<h2 class="s">'+L("Tournament restrictions","Restricciones de torneo")+'</h2>'+
 '<p class="b">'+L("Tournament allows exactly four: <strong>Ultra Health Potion, Protective Shield Potion, Mind Cleanser, Power Potion.</strong> One per round.","El torneo permite exactamente cuatro: <strong>Ultra Health Potion, Protective Shield Potion, Mind Cleanser, Power Potion.</strong> Una por ronda.")+'</p>'+
 '<h2 class="s">'+L("How to actually use them","Cómo usarlas de verdad")+'</h2>'+
 '<p class="b">'+L("Pre-load a <strong>Guard Potion</strong> before a hit you can see coming. Heal at 30–40% HP rather than waiting for critical. To reach <strong>Ultra Focus</strong> you <strong>Rest twice</strong> — a second Rest while already Focused upgrades you; a Focus Potion only ever grants plain Focus and is blocked if you already have it.","Prepara una <strong>Guard Potion</strong> antes de un golpe que veas venir. Cúrate al 30–40% de HP en vez de esperar al momento crítico. Para llegar a <strong>Ultra Focus</strong> haces <strong>Rest dos veces</strong> — un segundo Rest cuando ya tienes Focus te sube; una Focus Potion solo da Focus normal y se bloquea si ya lo tienes.")+'</p>'+
 '<p class="b">'+L("There is also a <strong>Black Market</strong> with rotating stock, and event panels with their own items.","También hay un <strong>Mercado Negro</strong> con stock rotativo, y paneles de evento con sus propios objetos.")+'</p>';
}};

PAGES.weapons={t:"Weapons",e:"The guide",d:"A separate equipment slot from gear, with its own catalog, its own materials, and an active skill you fire in combat.",h:function(){

 '<div class="callout"><p>'+L("Active skills are <strong>disabled in equalized modes</strong> — Blind Drop and Airdrop combat — where everyone fights on identical footing by design.","Las habilidades activas están <strong>deshabilitadas en los modos igualados</strong> — Blind Drop y el combate de Airdrop — donde todos pelean en igualdad por diseño.")+'</p></div>'+
 '<h2 class="s">'+L("The eighteen","Las dieciocho")+'</h2>'+cards(w)+

 '<h2 class="s">'+L("Matching a weapon to a build","Encajar un arma con una build")+'</h2>'+

 tbl(L(["Team size","Front","Rear","Commander"],["Tamaño","Front","Rear","Comandante"]),[
  ["4","2","1","1"],["5","3","1","1"],["6","3","2","1"],["7","4","2","1"],["8","5","2","1"],["9","6","2","1"],["10","7","2","1"]
 ],["n","n","n","n"])+
 '<h3 class="t">'+L("The three roles","Los tres roles")+'</h3>'+
 tbl(L(["Role","What they do"],["Rol","Qué hacen"]),LANG==="es"?[
  ['<strong>Front</strong>',"La línea que pelea primero. Todo el que no sea Rear ni Comandante es Front."],
  ['<strong>Rear Guard</strong>',"Se guarda hasta que el frente cae. Entra con <strong>+15% STR y +10% CON</strong> — refuerzos frescos, no carne de cañón."],
  ['<strong>Commander</strong>',"Uno por equipo, y el objetivo. Protegido hasta el final, luego entra con <strong>+50% HP, +25% STR, +20% CON</strong> si nunca lo tocaron. El equipo cuyo Comandante muere pierde."]
 ]:[
  ['<strong>Front</strong>',"The line that fights first. Everyone not a Rear or Commander is Front."],
  ['<strong>Rear Guard</strong>',"Held back until the front breaks. Enters with <strong>+15% STR and +10% CON</strong> — fresh reinforcements, not fodder."],
  ['<strong>Commander</strong>',"One per team, and the target. Protected until the very end, then enters with <strong>+50% HP, +25% STR, +20% CON</strong> if never touched. The team whose Commander dies loses."]
 ],["k",""])+
 '<h3 class="t">'+L("The phase cycle","El ciclo de fases")+'</h3>'+
 '<p class="b">'+L("Each cycle runs the attack through the enemy formation in order:","Cada ciclo lleva el ataque a través de la formación enemiga en orden:")+'</p>'+
 tbl(L(["Phase","The fight"],["Fase","La pelea"]),LANG==="es"?[
  ["Phase 1","Línea de frente contra línea de frente, todos a la vez."],
  ["Phase 2","Los supervivientes empujan contra la Rear Guard enemiga, ahora buffeada."],
  ["Phase 2B","Si ese empuje es repelido, Rear pelea contra Rear directamente."],
  ["Phase 3","Quien quede llega al Comandante defensor."]
 ]:[
  ["Phase 1","Front line versus front line, everyone at once."],
  ["Phase 2","The survivors push into the enemy Rear Guard, who are now buffed."],
  ["Phase 2B","If that push is repelled, Rear fights Rear directly."],
  ["Phase 3","Whoever is left reaches the defending Commander."]
 ],["k",""])+
 '<p class="b">'+L("If the Commander survives Phase 3, a <strong>new cycle</strong> begins: every player resets to full HP, but <strong>the Commander keeps its current HP</strong> — it is never healed back up. Chip it down across cycles and it stays down.","Si el Comandante sobrevive a la Fase 3, empieza un <strong>nuevo ciclo</strong>: cada jugador vuelve a full HP, pero <strong>el Comandante conserva su HP actual</strong> — nunca se le cura. Vas bajándolo a lo largo de los ciclos y se queda bajo.")+'</p>'+
 '<div class="callout"><p>'+L("<strong>Two mechanics keep it from stalling.</strong> <strong>Wear:</strong> if a Commander takes <em>zero</em> damage in a cycle, it loses 10% of its max HP anyway — you cannot turtle forever. <strong>Sudden Death:</strong> if no Commander has fallen by the sixth cycle, both Commanders and their Rears fight directly to the death, no more cycles.","<strong>Dos mecánicas evitan que se estanque.</strong> <strong>Desgaste:</strong> si un Comandante recibe <em>cero</em> daño en un ciclo, pierde igual el 10% de su HP máx — no puedes atrincherarte para siempre. <strong>Muerte súbita:</strong> si ningún Comandante ha caído en el sexto ciclo, ambos Comandantes y sus Rears pelean a muerte directamente, sin más ciclos.")+'</p></div>'+
 '<h3 class="t">'+L("Commanding from the front","Comandar desde el frente")+'</h3>'+
 '<p class="b">'+L("A Commander does not have to wait. They can <strong>Rush</strong> — enter the fight early — but a Mobilized Commander gets smaller bonuses (<strong>+40% HP, +15% STR, +10% CON</strong>) than one who stayed intact, and after rushing they must hold for <strong>2 rounds</strong> before they can Withdraw. Once you commit the Commander, you commit.","Un Comandante no tiene que esperar. Puede hacer <strong>Rush</strong> — entrar pronto a la pelea — pero un Comandante Movilizado recibe bonos menores (<strong>+40% HP, +15% STR, +10% CON</strong>) que uno que se mantuvo intacto, y tras el rush debe aguantar <strong>2 rondas</strong> antes de poder Retirarse. Una vez comprometes al Comandante, lo comprometes.")+'</p>'+
 '<div class="callout"><p>'+L("<strong>Vanguard rewards reading the board, not just hitting hardest.</strong> Who you put Front decides who absorbs Phase 1; a strong Rear turns a lost front into a counter-punch; and a Commander pushed too early — or held too timidly into Sudden Death — loses games a better team should win.","<strong>Vanguard premia leer el tablero, no solo pegar más fuerte.</strong> A quién pones en Front decide quién absorbe la Fase 1; un Rear fuerte convierte un frente perdido en un contragolpe; y un Comandante empujado demasiado pronto — o retenido con demasiada timidez hasta la Muerte súbita — pierde partidas que un mejor equipo debería ganar.")+'</p></div>'+
 '<h2 class="s">'+L("Events and drops","Eventos y drops")+'</h2>'+
 '<p class="b">'+L("Timed events drop rewards into a channel; you usually claim by clicking. <strong>Loot / Tag / Triad / Escort Drops</strong> are tied to specific modes, some with a <em>Doppel</em> twist. <strong>Blind Drop</strong> hides the reward. <strong>Traitor Drop</strong> adds a betrayal mechanic. <strong>Airdrops</strong> are promo-code drops with atomic first-come claims. The <strong>Roulette</strong> is a 2,000 OIL spin for withdrawable prizes, tokens and chaos gear.","Los eventos con temporizador sueltan recompensas en un canal; normalmente reclamas con un clic. <strong>Loot / Tag / Triad / Escort Drops</strong> están atados a modos concretos, algunos con un giro <em>Doppel</em>. <strong>Blind Drop</strong> oculta la recompensa. <strong>Traitor Drop</strong> añade una mecánica de traición. Los <strong>Airdrops</strong> son drops de códigos promo con reclamo atómico por orden de llegada. La <strong>Ruleta</strong> es un giro de 2,000 OIL por premios retirables, tokens y gear del caos.")+'</p>'+
 '<h2 class="s">The Marked Hunt</h2>'+
 '<p class="b">'+L("A random player gets marked and must face an NPC encounter. It triggers under conditions Max sets.","Un jugador al azar es marcado y debe enfrentar un encuentro con un NPC. Se activa bajo condiciones que fija Max.")+'</p>';
}};

PAGES.screens={t:"What It Looks Like",e:"Reference",d:"The actual combat screens, as the bot draws them in Discord. Every layout below is reproduced from the code that builds it — the same HP bars, stat lines and turn prompts you will see live.",h:function(){
 var g="#f0b232", red="#ed4245", blue="#5865f2", brown="#a0693e", teal="#3ba55d", purple="#9b59b6";

 // ── shared team engine — the canonical screen (story_32 cast) ──
 var teamBody=
  '<p class="dsc__hd">🟦 Guardians</p>'+
  '<p class="dsc__row"><span class="dsc__nm">• Max</span> ✅'+
   '<span class="dsc__sub"><span class="bar">'+hpbar(230,230)+'</span> <code>230/230 HP</code></span>'+
   '<span class="dsc__sub"><code>STR:32 AGI:13 CON:12</code></span>'+
   '<span class="dsc__sub"><code>Item:Team Heal +45 (3 lowest)</code></span></p>'+
  '<p class="dsc__row"><span class="dsc__nm">• Jessie</span>'+
   '<span class="dsc__sub"><span class="bar">'+hpbar(245,245)+'</span> <code>245/245 HP</code></span>'+
   '<span class="dsc__sub"><code>STR:16 AGI:10 CON:13</code></span>'+
   '<span class="dsc__sub"><code>Item:Used</code></span></p>'+
  '<p class="dsc__row"><span class="dsc__nm">• Garrick</span>'+
   '<span class="dsc__sub"><span class="bar">'+hpbar(305,305)+'</span> <code>305/305 HP</code></span>'+
   '<span class="dsc__sub"><code>STR:18 AGI:5 CON:17</code></span>'+
   '<span class="dsc__sub"><code>Item:Used</code></span></p>'+
  '<p class="dsc__hd">🟥 Valdris Advance</p>'+
  '<p class="dsc__row"><span class="dsc__nm">• Valdris Scout</span>'+
   '<span class="dsc__sub"><span class="bar">'+hpbar(180,215)+'</span> <code>180/215 HP</code></span>'+
   '<span class="dsc__sub"><code>STR:14 AGI:10 CON:11</code></span></p>'+
  '<p class="dsc__row"><span class="dsc__nm">• Valdris Pathfinder</span> ⚡🩸'+
   '<span class="dsc__sub"><span class="bar">'+hpbar(275,275)+'</span> <code>275/275 HP</code></span>'+
   '<span class="dsc__sub"><code>STR:19 AGI:7 CON:15</code></span></p>';

 return '<p class="b">There is no mystery to what a fight looks like. The bot draws a text embed each round with everyone\'s HP, stats and chosen action, then waits for you to press a button. Below is every screen in the game, drawn exactly as the code builds it.</p>'+
 '<div class="callout"><p>The bars are literal: <code style="font-family:var(--mono)">█</code> is HP you have, <code style="font-family:var(--mono)">░</code> is HP you have lost. <strong>✅</strong> next to a name means that fighter has locked their action this round; <strong>⏳</strong> means the round is still waiting on them.</p></div>'+

 '<h2 class="s">Team battles</h2>'+
 '<p class="b">One engine draws the screen for almost every group fight — <strong>Duels, Team &amp; Tag, Triad, Free-For-All, Escort, Horde, Mission, Vanguard, War and Boss Raids</strong>. What changes between them is the footer and a couple of extra fields, shown further down. This is the core layout:</p>'+
 dsc(g,"⚔️ Combat Phase - Choose Action",teamBody,
  "Select the name of the enemy you want to ATTACK.\n⏰ 2 Minutes to choose.")+
 '<p class="embcap">The 🟦/🟥 headers are the team names. <code>Item:</code> shows the consumable you have queued for the turn, or <code>Used</code> once spent. The ⚡🩸 after the Pathfinder are its NPC passives — Momentum and Lifesteal — shown as icons so you know what it does before it does it.</p>'+

 '<h2 class="s">1v1 Duel</h2>'+
 '<p class="b">Same engine, two fighters, and both of you pick <strong>at the same time</strong> — the choices reveal together. The only tell is the footer: no target to select, so it just says to choose carefully.</p>'+
 dsc(g,"⚔️ Combat Phase - Choose Action",
  '<p class="dsc__row"><span class="dsc__nm">• Max</span> ✅'+
   '<span class="dsc__sub"><span class="bar">'+hpbar(180,230)+'</span> <code>180/230 HP</code> [🔥 FOCUS]</span>'+
   '<span class="dsc__sub"><code>STR:32 AGI:13 CON:12</code></span>'+
   '<span class="dsc__sub"><code>Item:Guard Potion</code></span></p>'+
  '<p class="dsc__row"><span class="dsc__nm">• Rival</span> ⏳'+
   '<span class="dsc__sub"><span class="bar">'+hpbar(96,210)+'</span> <code>96/210 HP</code></span>'+
   '<span class="dsc__sub"><code>STR:20 AGI:18 CON:8</code></span>'+
   '<span class="dsc__sub"><code>Item:Used</code></span></p>',
  "Choose your move carefully.\n⏰ 2 Minutes to choose.")+
 '<p class="embcap"><span style="color:var(--brass)">🔥 FOCUS</span> next to Max means his next attack is a guaranteed ×2 — the flag turns into 🌟 ULTRA FOCUS once it is unreducible. Rival still shows ⏳: the round is waiting on their pick.</p>'+

 '<h2 class="s">Tag Duel</h2>'+
