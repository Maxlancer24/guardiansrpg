  ["Jessie","Mercenary · Gunslinger","Hard on the outside, deliberately: she keeps the reputation and the distance as armour. Underneath she is loyal and kind and almost never shows it. Found as a baby in the Greywood; she has never known who her parents were. She goes quiet when anyone says Veldran."],
  ["Elric","The Scribe · Scholar","Shy, quiet, very smart. Reads dead languages. Wants to belong with the group and feels like an academic among people of action. When he does speak he is usually right."],
  ["Cara","Broker","Pawnshop on the South Docks, crossbow always loaded, knows everything and everyone. She and Jessie have a history neither of them will explain. She stayed in Stormbay."],
  ["Valdris","The antagonist","Buys loyalties. Reached Stormbay four days ahead of you and has never once been behind since. He issued arrest warrants through the city\'s own legal channels, which tells you what he owns."],
  ["Gorim the Old","Keeper of the Scroll","Guarded it for years and co-wrote it. He knew who you were before you did. He has not appeared in person since."],
  ["Maren Varn","The last Varn","Thirty years hidden. Gave you the key. Described a couple who went to Aldenmoor thirty years ago: <em>she had hands like a fighter and eyes that didn\'t trust easily; he talked too much.</em>"],
  ["Garrick","Leader of the Aldenmoor refugees","Strong, charismatic, gives everything for his people, still optimistic despite the losses. He lost his brother on the second failed attempt to reach the underground stores."],
  ["Zoe","Jessie's childhood friend","Cheerful, fearless and forever getting into trouble. Grew up in Veldran with Jessie and knows the city — and its council receptions — inside out. Loves Jessie unconditionally; Jessie loves her back and is quietly terrified of the day she runs at something that does not work out."],
  ["The Frogst Brothers","Barrel and Hammer","Korn Army, but they came for you personally the night of the escape. Jessie faced both of them alone."]
 ].map(function(c){
  return '<div class="card"><div class="card__h"><span class="card__n">'+E(c[0])+'</span></div>'+
   '<div class="card__st">'+E(c[1])+'</div><div class="card__d">'+c[2]+"</div></div>";
 }).join("")+"</div>"+
 '<h2 class="s">Open threads</h2>'+
 '<p class="b"><strong>Who were Jessie\'s parents?</strong> They were looking for the same thing and walked the same road you are walking. That is all anyone knows. Elric found two names in the Ravennor archive and would not read them out.</p>'+
 '<p class="b"><strong>What does Valdris actually want?</strong> The scroll, obviously. Whether he wants to repair the seal or break it has never been said.</p>'+
 '<p class="b"><strong>Veldran.</strong> Second location. Jessie has a connection to it that she has not explained to anybody.</p>'+
 '<p class="b"><strong>Cara.</strong> She stayed. Jessie believes she is fine, and needs to.</p>'+
 '<p class="b"><strong>Gorim.</strong> Still gone.</p>';
}};

PAGES.story={t:"The Main Story",e:"Campaign",d:"A story campaign that runs inside the combat engine — you and the story's own protagonists fighting at your side, three chapters deep and still being written.",h:function(){
 function beats(rows,liveId){
  return rows.map(function(r){
   var live=(r[0]===liveId);
   return '<div class="bt'+(live?" live":"")+'"><span class="bt__i">'+E(r[0])+'</span><div><span class="bt__n">'+E(r[1])+(live?" — latest":"")+'</span>'+
    (r[2]?'<div class="bt__d">'+E(r[2])+"</div>":"")+"</div></div>";
  }).join("");
 }
 function scene(src,ttl,cap){
  return '<figure class="chap__scene"><img src="'+src+'" alt="'+E(ttl)+'" width="1672" height="941" loading="lazy" decoding="async">'+
   '<figcaption><span class="scap__t">'+E(ttl)+'</span><span class="scap__d">'+E(cap)+'</span></figcaption></figure>';
 }
 return '<p class="b">Each mission is a real fight with story beats woven through it. They run in order — every one requires the one before it — and most of Chapter One is playable with a partner.</p>'+
 '<div class="chap"><div class="chap__h"><h2>Chapter One</h2><span class="chap__id">14 missions</span><span class="chap__st">Complete</span></div>'+
 '<p class="chap__w">Stormbay</p>'+
 '<div class="chap__body"><div class="chap__beats">'+beats(CH1)+'</div>'+
 scene(SCENE1,"Stormbay · Pier 7","Jessie cuts the rope and covers your escape alone — two pistols, both Frogst brothers, her back to the water.")+
 '</div></div>'+
 '<div class="ex"><p class="ex__h">The Grey Maren — the last image of Chapter One</p>'+
 '<p>Jessie cuts the rope. You jump. The boat pulls away from Pier 7 and the last thing you see of her is her back, two pistols out, facing Barrel and Hammer Frogst at the same time.</p></div>'+
 '<div class="chap"><div class="chap__h"><h2>Chapter Two</h2><span class="chap__id">12 missions</span><span class="chap__st">Complete</span></div>'+
 '<p class="chap__w">The coast road · Ravennor · Aldenmoor</p>'+
 '<div class="chap__body"><div class="chap__beats">'+beats(CH2)+'</div>'+
 scene(SCENE2,"The Siege of Aldenmoor","The siege at its height — Garrick\'s maul, Jessie\'s pistols, your blade, and Valdris\'s forces pouring through the walls.")+
 '</div></div>'+
 '<div class="ex"><p class="ex__h">She\'ll Find You</p>'+
 '<p>Cornered, with Elric behind you and more of them coming, you finally open the note Cara left you.</p>'+
 '<p><em>"She\'ll find you. She always finds what she\'s looking for. — C"</em></p>'+
 '<p>Jessie takes the flank apart on her own. Half of them go down before the rest run. She says one thing.</p>'+
 '<p><em>"Took you long enough to open that."</em></p></div>'+
 '<div class="chap"><div class="chap__h"><h2>Chapter Three</h2><span class="chap__id">12 missions so far</span><span class="chap__st live">In progress</span></div>'+
 '<p class="chap__w">Ironhollow · the pass · Veldran</p>'+
 '<div class="chap__body"><div class="chap__beats">'+beats(CH3,"38")+'</div>'+
 scene(SCENE3,"The Gala · Veldran","Zoe leads you in, Garrick works the floor, Jessie moves to the bidding — and the auction bell waits on the table.")+
 '</div></div>'+
 '<div class="ex"><p class="ex__h">The Bid — the current front of the story</p>'+
 '<p>You reach the relic chamber and Zoe produces a key from somewhere in her formal attire without breaking stride. <em>"Does Jessie know about the key?"</em> you ask. Zoe considers it for exactly one second.</p>'+
 '<p><em>"No. But she would be furious first and then secretly impressed. I know the order."</em></p>'+
 '<p class="embcap" style="margin:.6rem 0 0">Two walls away, on the crystal, Jessie is still bidding: <em>"Going up again. He does not look happy." … "Good."</em></p></div>'+
 '<h2 class="s">Where it is going</h2>'+
 '<p class="b">The scroll named three places. <strong>Aldenmoor</strong> is done and its seal piece is accounted for. In <strong>Veldran</strong>, the second, the plan is no longer a plan — it is in motion. The <strong>founding relic</strong> is being <strong>sold at auction</strong> at a council reception, the bidding quietly <strong>fixed for Valdris</strong> by someone inside the council, so the job became a heist in eveningwear as senator <strong>Bren Valos</strong>\'s guests. Right now <strong>Jessie</strong> is holding the auction table — bidding Valdris\'s buyer <strong>Soran Kael</strong> higher and higher, and enjoying it — to keep the room\'s eyes on her, while you and <strong>Zoe</strong> have slipped past the checkpoint, put down an off-book Valdris patrol, and reached the <strong>relic chamber</strong>. You have the replica in hand and the real relic three steps away: the <strong>swap</strong> is the next move. Two things still linger — Bren <em>recognised</em> the relic when Elric described it, and he <strong>knew Jessie\'s parents</strong>, the oldest open question in the story. <strong>Mirefall</strong> is a swamp in the south-east, and nobody has said one word about it yet.</p>';
}};

PAGES.sides={t:"Side Stories",e:"Campaign",d:"Fifty more missions across ten arcs, separate from the main line. Most run 3-player; each arc is a chain you play in order.",h:function(){
 var arcs=SIDES.map(function(a){
  return '<div class="arc"><div class="arc__h"><h3>'+E(a[0])+'</h3><span class="arc__c">'+a[2]+' missions</span><span class="arc__p">up to '+a[3]+' player'+(a[3]>1?"s":"")+'</span></div>'+
   '<div class="arc__b"><p class="arc__d">'+E(a[4])+'</p><div class="arc__l">'+

 return '<p class="b">Side stories are their own chains — each one requires the previous mission in its arc, and none of them require the main story except <strong>Millhaven</strong>, which opens once you have met Jessie.</p>'+

PAGES.expeditions={t:"How Expeditions Work",e:"Expeditions",d:"Timed sea voyages to island regions that sit apart from the normal map — each with its own tides, currency, wildlife and exclusive loot. You sail out from Ravennor and back.",h:function(){
 return '<h2 class="s">What an expedition is</h2>'+
 '<p class="b">An <strong>expedition</strong> is a <strong>timed, repeatable voyage</strong> to a special region that is not on the normal Valestia map. Each destination has its own <strong>tides, wildlife, regional currency and exclusive rewards</strong>, and it is reached only by <strong>ship from Ravennor</strong>. Expeditions run in scheduled windows — a launch opens boarding, the seas stay open for a set time, and then it closes.</p>'+
 '<p class="b">Open the permanent <strong>Ravennor Expedition Hall</strong> once you are in Ravennor. It lists every destination, your voyages, and a short how-it-works panel — new expeditions appear here over time without replacing the ones before them.</p>'+
 '<h2 class="s">The voyage — step by step</h2>'+
 tbl(["Step","What you do"],[
  ["1 · Reach Ravennor","Travel the normal Valestia map to <strong>Ravennor</strong> and open its <strong>Expedition Hall</strong>."],
  ["2 · Browse &amp; board","Pick a destination, read its guide, and press <strong>Board Ship</strong>. The sea crossing takes <strong>45 real minutes</strong> and <strong>cannot be skipped</strong> — not even by a clan teleport."],
  ["3 · Land &amp; play","On arrival your regional access swaps to the expedition. Use <span class=\"cmd\">!hunt</span> and <span class=\"cmd\">!safari</span> in the expedition channel only."],

 '<div class="callout"><p>⏳ The 45-minute timers are <strong>real time</strong> and survive a bot restart, so a voyage is never skipped or lost. Even after a launch <em>ends</em>, anyone already on the islands can still sail back.</p></div>'+
 '<h2 class="s">Currency &amp; rewards</h2>'+
 '<p class="b">While you are on an expedition, a successful <span class="cmd">!hunt</span> pays a <strong>regional currency</strong> instead of the usual crafting materials, and <span class="cmd">!safari</span> finds <strong>Pokemax that live only there</strong>. You spend the currency at the destination\'s own <strong>exchange</strong> on exclusive gear, a weapon, catch items and a permanent title — none of it craftable back at the mainland forge.</p>'+
 '<div class="callout"><p>🧭 <strong>Destinations live in their own section.</strong> The first one is open now — see <a href="#sunken-fang">The Sunken Fang Archipelago</a>.</p></div>';

PAGES["sunken-fang"]={t:"The Sunken Fang Archipelago",e:"Expeditions",d:"The first expedition destination — a broken crown of islands beyond the Sable Sea, where a six-hour tide changes the hunt, the wildlife and the trails.",h:function(){
 return '<p class="b">The first expedition destination. <em>A broken crown of islands built over the ribs of an ancient leviathan, out beyond the Sable Sea.</em> Twice a day the ocean swallows the reefs and reveals them again, and every den, trail and hunting ground changes with it. Sail here from <a href="#expeditions">Ravennor</a> — 45 minutes each way.</p>'+

 tbl(["Tide","Hunts pay","Safari Pokemax (tide-only)"],[
  ['🌊 <strong>High Tide</strong>',"1–4 Fang Doubloons","The <strong>Driftfin</strong> line (→ Gale Ray → Tempest Manta) and the <strong>Shellwisp</strong> line (→ Lantern Hermit → Abyssal Hermit)."],

  ['💎 Tideglass Shard',"3","Enhancement material for the Tideglass Compass (+4 and +5). Limit 5."],

var built={};
var _reduceMotion=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function initHome(){
 /* count-up the hero stat chips, once per visit */
 var nums=document.querySelectorAll("#pg-home .stat b[data-to]");
 nums.forEach(function(el){
  var to=+el.getAttribute("data-to")||0;
  if(_reduceMotion){el.textContent=to;return;}
  var start=null, dur=900;
  function step(ts){
   if(start===null) start=ts;
   var p=Math.min(1,(ts-start)/dur), e=1-Math.pow(1-p,3);
   el.textContent=Math.round(to*e);
   if(p<1) requestAnimationFrame(step);
  }
  el.textContent="0"; requestAnimationFrame(step);
 });
}
/* reveal any .reveal elements inside the active page (home cards, character cards…) */
function revealIn(id){
 var host=document.getElementById("pg-"+id); if(!host) return;
 var els=host.querySelectorAll(".reveal:not(.in)");
 if(_reduceMotion||!("IntersectionObserver" in window)){ els.forEach(function(e){e.classList.add("in");}); return; }
 var io=new IntersectionObserver(function(es){
  es.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target); } });
 },{rootMargin:"0px 0px -6% 0px"});
 els.forEach(function(e,i){ e.style.transitionDelay=(Math.min(i,8)*0.05)+"s"; io.observe(e); });
}

}
addEventListener("hashchange",route);

/* ══════════════════════════════════════════════════════════════════
   CALCULATOR
   ══════════════════════════════════════════════════════════════════ */
function initCalc(){
 var S={lvl:20,str:10,agi:9,con:10};
 var DEF=[["str","STR","Damage per hit, and the spine of your parry"],
          ["agi","AGI","Damage multiplier, crit, dodge, flat reduction"],
          ["con","CON","Max HP, rest healing, block and counter"]];
 var budget=function(){return 10+(S.lvl-1);}, spent=function(){return S.str+S.agi+S.con;};
 function crit(a){return a<=10?a:10+Math.floor((a-10)/3);}
 function oc(a){return 1+0.5*(a/29);}
 var sEl=document.getElementById("stats");
 sEl.innerHTML=DEF.map(function(d){
  return '<div class="st"><div class="st__t"><span class="st__k">'+d[1]+'</span><span class="st__d">'+d[2]+'</span>'+
   '<span class="st__v num" data-v="'+d[0]+'">0</span></div><div class="st__r">'+
   '<button class="btn" data-dec="'+d[0]+'" aria-label="Lower '+d[1]+'">−</button>'+
   '<span class="mtr"><span class="mtr__f" data-m="'+d[0]+'"></span></span>'+
   '<button class="btn" data-inc="'+d[0]+'" aria-label="Raise '+d[1]+'">+</button></div></div>';
 }).join("");
 var TL=[["hp","Max HP","50 + CON×15",1],["rest","Rest heals","20 + CON×3"],["crit","Crit / Dodge","from AGI"],
         ["red","Flat reduction","AGI × 2.5"],["blk","Parry block","CON×5 + STR"],["ctr","Parry counter","CON×3 + STR"]];
 document.getElementById("ro").innerHTML=TL.map(function(t){
  return '<div class="tl"><span class="tl__k">'+t[1]+'</span><span class="tl__v num'+(t[3]?" br":"")+'" data-t="'+t[0]+'">—</span><span class="tl__f">'+t[2]+"</span></div>";
 }).join("");
 function verdict(){
  var a=S.agi,c=S.con,s=S.str,tot=spent()||1,left=budget()-spent();
  if(left>0) return "You have <strong>"+left+"</strong> unspent point"+(left>1?"s":"")+".";
  if(c/tot>=.5) return "A parry tank. You block <strong>"+(c*5+s)+"</strong> and counter for <strong>"+(c*3+s)+"</strong> — and Ultra Focus walks straight through all of it.";
  if(a/tot>=.45) return "A dodge build. <strong>"+crit(a)+"%</strong> to avoid the hit outright and <strong>"+(a*2.5)+"</strong> off whatever lands.";
  if(s/tot>=.5) return "A hitter. <strong>"+Math.round((s*4+10)*oc(a))+"</strong> on an average swing, <strong>"+Math.round((s*4+10)*oc(a)*2)+"</strong> with Focus. A tank who rests will bury you.";
  return "Balanced. <strong>"+(50+c*15)+"</strong> HP, <strong>"+crit(a)+"%</strong> crit, no glaring hole — and nothing that scares anyone.";
 }
 function render(){
  var b=budget(),sp=spent();
  document.getElementById("lvV").textContent=S.lvl;
  var bd=document.getElementById("bud"); bd.textContent=sp+" / "+b; bd.classList.toggle("over",sp>b);
  DEF.forEach(function(d){
   document.querySelector('[data-v="'+d[0]+'"]').textContent=S[d[0]];
   document.querySelector('[data-m="'+d[0]+'"]').style.width=Math.min(100,(S[d[0]]/40)*100)+"%";
   document.querySelector('[data-inc="'+d[0]+'"]').disabled=(sp>=b);
   document.querySelector('[data-dec="'+d[0]+'"]').disabled=(S[d[0]]<=0);
  });
  document.getElementById("lvD").disabled=(S.lvl<=1);
  var set={hp:50+S.con*15,rest:20+S.con*3,crit:crit(S.agi)+"%",red:S.agi*2.5,blk:S.con*5+S.str,ctr:S.con*3+S.str};
  Object.keys(set).forEach(function(k){document.querySelector('[data-t="'+k+'"]').textContent=set[k];});
  var m=oc(S.agi), lo=Math.round((S.str*4+5)*m), hi=Math.round((S.str*4+15)*m), sc=Math.max(1,hi*2);
  function bar(si,ni,l,h,col){
   var e=document.getElementById(si);
   e.style.left=(l/sc*100)+"%"; e.style.width=Math.max(1.5,(h-l)/sc*100)+"%"; e.style.background=col;
   document.getElementById(ni).textContent=l+"–"+h;
  }
  bar("sN","nN",lo,hi,"var(--verdigris)");
  bar("sC","nC",Math.round(lo*1.5),Math.round(hi*1.5),"var(--brass)");
  bar("sF","nF",lo*2,hi*2,"var(--corrupt)");
  document.getElementById("vd").innerHTML=verdict();
 }
 document.getElementById("lvU").addEventListener("click",function(){if(S.lvl<70){S.lvl++;render();}});
 document.getElementById("lvD").addEventListener("click",function(){if(S.lvl>1){S.lvl--;render();}});
 sEl.addEventListener("click",function(e){
  var i=e.target.closest("[data-inc]"), d=e.target.closest("[data-dec]");
  if(i&&spent()<budget()){S[i.dataset.inc]++;render();}
  if(d&&S[d.dataset.dec]>0){S[d.dataset.dec]--;render();}
 });
 render();
}

/* ══════════════════════════════════════════════════════════════════
   PET LAB — the same formulas pet_data.stats_at_level / default_moves run
   ══════════════════════════════════════════════════════════════════ */
function initLab(){
 /* PET_DB.S rows: [id,name,emoji,type,region,role,stage,hp,atk,def,spd,evolves_to,learnset] */
 var S={}, byLine={}, MV={};
 PET_DB.S.forEach(function(r){
  S[r[0]]={id:r[0],name:r[1],emoji:r[2],type:r[3],region:r[4],role:r[5],stage:r[6],
           base:{hp:r[7],atk:r[8],def:r[9],spd:r[10]},evo:r[11],learn:r[12]};
 });
 PET_DB.M.forEach(function(m){
  MV[m[0]]={id:m[0],name:m[1],type:m[2],power:m[3],acc:m[4],pp:m[5],pri:m[6],eff:m[7]};
 });
 /* rebuild each family chain by walking evolves_to from every stage-1 */
 Object.keys(S).forEach(function(k){
  var s=S[k]; if(s.stage!==1) return;
  var chain=[k], cur=s;
  while(cur.evo && S[cur.evo]){ chain.push(cur.evo); cur=S[cur.evo]; }
  chain.forEach(function(id){ byLine[id]=chain; });
 });

 var REG={starter_ruins:"Starter Ruins",crimson_plain:"Crimson Plain",stormbay_docks:"Stormbay Docks",
  rocky_chill_pass:"Rocky Chill Pass",black_lotus_wood:"Black Lotus Wood",ravencraft:"Ravencraft",
  mist_forest:"The Mist Forest",bandit_caves:"Bandit Caves",dark_knight_sanctum:"Dark Knight's Sanctum"};
 var TEMO={fire:"🔥",water:"💧",grass:"🌿",ice:"❄️",rock:"🪨",flying:"🦅",ghost:"👻",dark:"🌑",neutral:"⚪"};

 /* engine formulas, verbatim */
 function statsAt(id,lv,g){
  var b=S[id].base, o={};
  o.hp=Math.floor(b.hp*lv/50)+lv+10+(g.hp||0);
  ["atk","def","spd"].forEach(function(k){ o[k]=Math.floor(b[k]*lv/50)+5+(g[k]||0); });
  return o;
 }
 /* the last four distinct moves learned at or below `lv` */
 function movesAt(id,lv){
  var known=[];
  S[id].learn.forEach(function(p){ if(p[0]<=lv && known.indexOf(p[1])<0) known.push(p[1]); });
  return known.slice(-4);
 }
 /* which stage of the line you are at this level: evolves at 16 and 36 */
 function stageAt(line,lv){ return lv>=36?Math.min(2,line.length-1):(lv>=16?Math.min(1,line.length-1):0); }

 /* ceilings: strongest final-stage value per stat, for honest bar scaling */
 var CEIL={hp:0,atk:0,def:0,spd:0};
 Object.keys(S).forEach(function(k){
  if(S[k].stage!==3) return;
  var s=statsAt(k,50,{hp:15,atk:15,def:15,spd:15});
  ["hp","atk","def","spd"].forEach(function(x){ if(s[x]>CEIL[x]) CEIL[x]=s[x]; });
 });

 var st={sp:"cinderling",lv:50,g:{hp:15,atk:15,def:15,spd:15}};

 /* species picker, grouped by region */
 var sel=document.getElementById("labSp"), groups={};
 PET_DB.S.forEach(function(r){ (groups[r[4]]=groups[r[4]]||[]).push(r[0]); });
 sel.innerHTML=Object.keys(REG).map(function(rg){
  var list=(groups[rg]||[]).slice().sort(function(a,b){
   return S[a].stage-S[b].stage || S[a].name.localeCompare(S[b].name);
  });
  return '<optgroup label="'+E(REG[rg])+' · '+E(S[list[0]].type)+'">'+
   list.map(function(id){
    return '<option value="'+id+'">'+E(S[id].emoji+" "+S[id].name)+" — stage "+S[id].stage+"</option>";
   }).join("")+"</optgroup>";
 }).join("");
 sel.value=st.sp;

 /* gene sliders */
 var GK=[["hp","HP"],["atk","ATK"],["def","DEF"],["spd","SPD"]];
 document.getElementById("labGenes").innerHTML=
  '<div class="lab__l" style="margin-bottom:-.3rem">Genes <b class="num" id="labGT">60 / 60</b></div>'+
  GK.map(function(g){
   return '<div class="lab__f"><label class="lab__l" for="lg_'+g[0]+'">'+g[1]+
    ' gene <b class="num" data-gv="'+g[0]+'">15</b></label>'+
    '<input class="lab__rng" type="range" id="lg_'+g[0]+'" data-g="'+g[0]+'" min="0" max="15" value="15"></div>';
  }).join("");

 function quality(v){ return v<=4?"Poor":v<=8?"Average":v<=11?"Good":v<=13?"Excellent":"Exceptional"; }
 function totalQuality(t){ return t<=19?["Poor",1]:t<=31?["Average",2]:t<=43?["Good",3]:t<=52?["Excellent",4]:["Exceptional",5]; }

 function render(){
  var line=byLine[st.sp]||[st.sp];
  var id=line[stageAt(line,st.lv)];          /* auto-evolve with level */
  var s=S[id], cur=statsAt(id,st.lv,st.g), zero=statsAt(id,st.lv,{});

  document.getElementById("labLvV").textContent=st.lv;
  var tot=st.g.hp+st.g.atk+st.g.def+st.g.spd, tq=totalQuality(tot);
  document.getElementById("labGT").textContent=tot+" / 60";
  GK.forEach(function(g){ document.querySelector('[data-gv="'+g[0]+'"]').textContent=st.g[g[0]]; });

  document.getElementById("labId").innerHTML=
   '<span class="lab__emo">'+s.emoji+'</span><div><div class="lab__nm">'+E(s.name)+'</div>'+
   '<div class="lab__meta">'+E(REG[s.region])+' · stage '+s.stage+' of '+line.length+'</div></div>'+
   '<div class="lab__badges"><span class="lab__bd lab__bd--t">'+TEMO[s.type]+" "+E(s.type)+'</span>'+
   '<span class="lab__bd">'+E(s.role)+'</span></div>';

  document.getElementById("labStats").innerHTML=GK.map(function(g){
   var k=g[0], v=cur[k], z=zero[k], d=v-z;
   return '<div class="sb" style="grid-column:span 2"><div class="sb__t"><span class="sb__k">'+g[1]+'</span>'+
    '<span class="sb__v num">'+v+'</span>'+(d>0?'<span class="sb__d">+'+d+' from genes</span>':'')+'</div>'+
    '<div class="sb__bar"><span class="sb__ghost" style="width:'+Math.min(100,z/CEIL[k]*100)+'%"></span>'+
    '<span class="sb__fill" style="width:'+Math.min(100,v/CEIL[k]*100)+'%"></span></div></div>';
  }).join("");

  document.getElementById("labChain").innerHTML=line.map(function(x,i){
   var at=[1,16,36][i];
   return (i?'<span class="ev__ar">→</span>':'')+
    '<span class="ev'+(x===id?" on":"")+'">'+S[x].emoji+" "+E(S[x].name)+
    (i?' <b>lv'+at+'</b>':'')+"</span>";
  }).join("");

  var mv=movesAt(id,st.lv);
  document.getElementById("labMoves").innerHTML=mv.map(function(m){
   var M=MV[m], stab=(M.type===s.type);
   return '<div class="mv'+(stab?" mv--stab":"")+'"><div class="mv__h"><span class="mv__n">'+E(M.name)+'</span>'+
    '<span class="mv__t">'+(TEMO[M.type]||"")+" "+E(M.type)+'</span></div>'+
    '<div class="mv__s">'+(M.power?"pow "+M.power:"status")+" · acc "+(M.acc>100?"—":M.acc)+" · "+M.pp+" PP"+
    (M.pri?" · priority +"+M.pri:"")+(stab?" · STAB ×1.5":"")+'</div>'+
    (M.eff?'<div class="mv__e">'+E(M.eff)+"</div>":"")+"</div>";
  }).join("");

  document.getElementById("labLearn").innerHTML=S[id].learn.map(function(p){
   var M=MV[p[1]]; if(!M) return "";
   var stab=(M.type===s.type), known=(p[0]<=st.lv);
   return '<div class="lrn'+(stab?" lrn--stab":"")+'" style="'+(known?"":"opacity:.62")+'">'+
    '<span class="lrn__lv">Lv '+p[0]+'</span>'+
    '<span class="lrn__n">'+E(M.name)+'</span>'+
    '<span class="lrn__t">'+(TEMO[M.type]||"")+" "+E(M.type)+(stab?" · STAB":"")+'</span>'+
    '<span class="lrn__m">'+(M.power?"pow "+M.power:"status")+" · "+M.pp+" PP"+(M.pri?" · pri +"+M.pri:"")+'</span>'+
    (M.eff?'<span class="lrn__e">'+E(M.eff)+"</span>":"")+"</div>";
  }).join("");

  var next=null;
  S[id].learn.forEach(function(p){ if(p[0]>st.lv && next===null) next=p; });
  document.getElementById("labNote").innerHTML=
   (PET_DB.D[id]?"<em>"+E(PET_DB.D[id])+"</em><br>":"")+
   (next?"Next move at level <strong>"+next[0]+"</strong>: "+E(MV[next[1]].name)+". ":"")+
   (mv.length<4?"Only "+mv.length+" move"+(mv.length>1?"s":"")+" known — it fills to 4 as it levels.":"");

  document.getElementById("labQ").innerHTML=
   "Gene total <strong>"+tot+"/60</strong> — <strong>"+tq[0]+"</strong>. Releasing this Pokemax would pay <strong>"+
   tq[1]+"</strong> Gene Essence."+(tot===60?" A perfect roll; you will not see many.":"");
 }

 sel.addEventListener("change",function(){ st.sp=sel.value; render(); });
 document.getElementById("labLv").addEventListener("input",function(e){ st.lv=+e.target.value; render(); });
 document.getElementById("labGenes").addEventListener("input",function(e){
  var g=e.target.dataset.g; if(!g) return;
  st.g[g]=+e.target.value; render();
 });
 function setGenes(fn){
  GK.forEach(function(g){
   st.g[g[0]]=fn();
   document.getElementById("lg_"+g[0]).value=st.g[g[0]];
  });
  render();
 }
 document.getElementById("labPerfect").addEventListener("click",function(){ setGenes(function(){return 15;}); });
 document.getElementById("labZero").addEventListener("click",function(){ setGenes(function(){return 0;}); });
 document.getElementById("labRoll").addEventListener("click",function(){
  setGenes(function(){ return Math.floor(Math.random()*16); });
 });
 render();
}

/* ══════════════════════════════════════════════════════════════════
   MAP OF VALESTIA
   ══════════════════════════════════════════════════════════════════ */
function initMap(){
 /* The painted map is the real artwork; markers are positioned over it in
    percentages, so they track the image at every width. */
 var s='<div class="mapwrap"><img class="mapimg" src="'+MAP_SRC+'" alt="Map of Valestia" width="1485" height="810" loading="lazy" decoding="async">';
 Object.keys(PLACES).forEach(function(id){
  var p=PLACES[id]; if(p.t==="geo") return;
  s+='<button class="pin '+(p.t==="hunt"?"hunt":"")+(p.t==="seal"?" seal":"")+'" data-n="'+id+'"'+
     ' style="left:'+p.x+'%;top:'+p.y+'%" aria-label="'+E(p.n)+'"><span class="pin__d"></span>'+
     '<span class="pin__t">'+E(p.n)+'</span></button>';
 });
 s+="</div>";
 document.getElementById("map").innerHTML=s;

 var dos=document.getElementById("dos");
 function sel(id){
  var p=PLACES[id];
  document.querySelectorAll(".pin").forEach(function(n){n.classList.toggle("on",n.dataset.n===id);});
  var kind={hunt:"Huntable region",story:"Story location",side:"Side story",seal:"Seal site",portal:"Portal region"}[p.t]||"Location";
  var h='<p class="dos__e">'+kind.toUpperCase()+'</p><h3>'+E(p.n)+"</h3>";
  h+='<div class="dos__r"><p class="dos__x">'+E(p.d)+"</p></div>";
  if(p.m){
   h+='<div class="dos__r"><p class="dos__k">Signature material</p><p class="dos__m">'+E(p.m)+'</p>'+
      '<p class="dos__x" style="margin-top:.3rem">Only drops here. Feeds this region\'s gear and one weapon recipe.</p></div>';
  }
  if(FAUNA[id]){
   h+='<div class="dos__r"><p class="dos__k">Species — tier 1 → 7</p>';
   FAUNA[id].forEach(function(f){
    h+='<p class="sp"><span class="sp__a">'+f[0]+'</span><span class="sp__n"><b>'+E(f[1])+"</b> → <b>"+E(f[2])+"</b></span></p>";
   });
   h+="</div>";
  }
  var links=ROADS.filter(function(r){return r[0]===id||r[1]===id;})
    .map(function(r){var o=r[0]===id?r[1]:r[0];return PLACES[o]?PLACES[o].n:null;}).filter(Boolean);
  if(links.length) h+='<div class="dos__r"><p class="dos__k">Connects to</p><p class="dos__x">'+links.join(" · ")+"</p></div>";
  dos.innerHTML=h;
 }
 /* <button> already fires on Enter/Space, so click alone covers the keyboard */
 document.getElementById("map").addEventListener("click",function(e){
  var n=e.target.closest("[data-n]"); if(n) sel(n.dataset.n);
 });
 sel("stormbay");
}

route();
})();
</script>
